name: augeas-bsd

# pkgsrc を OpenBSD と FreeBSD で bootstrap し、そこで sysutils/augeas を
# 建てる。手元の CI が見ているのは NetBSD だけなので、そこでは確かめようの
# ない三つを見るためのもの。
#
#   1. -fexceptions
#      OpenBSD の ports は configure から -fexceptions と
#      -fasynchronous-unwind-tables を外す patch を抱えている。添えられた
#      ログでは libcompiler_rt の __gcc_personality_v0 が _Unwind_* を
#      引けずにリンクが落ちている。上流のフラグ検査は ac_fn_c_try_link で
#      リンクまで見ているので検査は通るはずで、検査用の main(){} が例外表を
#      使わないため本体のリンクで初めて落ちる、というのがこちらの読み。
#      手元に OpenBSD が無いので確かめていない。
#
#   2. lens の filter 二本
#      /etc/adduser.conf を Shellvars から Simplevars へ移したものと、
#      /etc/wsconsctlctl.conf の綴りを直したもの。どちらも NetBSD には
#      対象のファイルが無く、効くのはここだけである。
#
#   3. その箱で解釈に失敗する設定ファイルの一覧
#      lens は 231 本あり glob を除いても 331 個のパスを主張している。目で
#      追っても確証にならないので、全部読ませて augeas 自身に言わせる。
#      出るのは実在して、かつ解釈に失敗したものだけである。通ったように
#      見えて構造が違うものは出ない。
#
# pkgsrc/bootstrap/README と README.OpenBSD / README.FreeBSD に従う。
# bmake を使うこと、$prefix/bin を PATH の前に置くこと、OpenBSD では
# pkgsrc の pkg_* が base の同名コマンドと衝突すること。base を退避すると
# fw_update(1) が壊れると README が明記しているので、PATH の順で避ける。
#
# 手で起動する。押すまで何もしない。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'どちらを回すか'
        type: choice
        options: [both, openbsd, freebsd, openbsd-tarball, openbsd-probe, netbsd-i386]
        default: both
      pkgsrc:
        description: 'pkgsrc の配布物 (current か stable)'
        type: choice
        options: [current, stable]
        default: current
      openbsd_release:
        description: 'OpenBSD の版'
        default: '7.9'
      freebsd_release:
        description: 'FreeBSD の版'
        default: '14.3'

# prefix と作業場所は job ごとに決める。OpenBSD は / が 986M しかなく、
# 空いているのは /home (113G) と /usr (16.9G) の方である。最初これを
# 見落として / に置き、pkgsrc の展開中に溢れた。

jobs:
  openbsd:
    if: inputs.target == 'both' || inputs.target == 'openbsd'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # / は 986M しかない。木も work も /home (113G) に置き、prefix は
      # /usr (16.9G 空き) に置く。既定の /usr/pkg のままでよい。
      WORK: /home/work
      PREFIX: /usr/pkg
    steps:
      - uses: actions/checkout@v4

      - name: OpenBSD で bootstrap して augeas を建てる
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ inputs.openbsd_release }}
          mem: 8192
          cpu: 4
          sync: 'no'
          copyback: false
          envs: 'PREFIX WORK'
          prepare: |
            # bootstrap 自体は base で足りる。pkg_add は何も入れない。
            df -h
          run: |
            set -x
            uname -a
            cc --version | head -2
            df -h

            echo '##### 1. pkgsrc と overlay を取る #####'
            # / は 986M しかない。作業は /home でする。
            mkdir -p "$WORK" && cd "$WORK"
            ftp -o pkgsrc.tar.gz https://cdn.NetBSD.org/pub/pkgsrc/${{ inputs.pkgsrc }}/pkgsrc.tar.gz
            tar xzf pkgsrc.tar.gz
            ftp -o overlay.tar.gz https://codeload.github.com/zakinko/pkgsrc-zakinko/tar.gz/refs/heads/main
            tar xzf overlay.tar.gz
            cp -Rf pkgsrc-zakinko-main/overlay/sysutils/augeas/. pkgsrc/sysutils/augeas/
            ls pkgsrc/sysutils/augeas/patches
            df -h

            echo '##### 2. bootstrap #####'
            cd "$WORK/pkgsrc/bootstrap"
            ./bootstrap --prefix "$PREFIX" --workdir "$WORK/bs" >/tmp/bootstrap.log 2>&1
            rc=$?
            echo "--- bootstrap の終了状態: $rc ---"
            tail -25 /tmp/bootstrap.log
            PATH=$PREFIX/bin:$PREFIX/sbin:$PATH
            export PATH
            # bootstrap は digest を入れない (bootstrap の中に digest の字は
            # 一つも無い)。makepatchsum が ${PREFIX}/bin/digest を呼ぶので、
            # pkgtools/digest を先に建てておく。NetBSD の CI では既に入って
            # いるため、ここで初めて露見した。
            ( cd "$WORK/pkgsrc/pkgtools/digest" && bmake install ) >/tmp/digest.log 2>&1 || {
              echo '!! pkgtools/digest を建てられなかった'; tail -30 /tmp/digest.log; exit 1; }
            # 終了状態だけでは足りない。実物を見て止める。
            for t in "$PREFIX/bin/bmake" "$PREFIX/bin/digest"; do
              if [ -x "$t" ]; then echo "  ok $t"
              else echo "!! $t が無い"; ls "$PREFIX/bin" "$PREFIX/sbin" 2>&1 | head -30; exit 1; fi
            done
            bmake --version | head -1
            # pkgsrc が建てる devel/pkgconf は OpenBSD 7.9 で segfault する
            #   checking pkg-config is at least version 0.9.0...
            #   Segmentation fault (core dumped)
            # OpenBSD は base に pkgconf を持っていて、usr.bin/pkgconf の
            # PROG は pkg-config である。そちらを使わせる。
            ls -l /usr/bin/pkg-config; /usr/bin/pkg-config --version
            echo 'TOOLS_PLATFORM.pkg-config=	/usr/bin/pkg-config' >>"$PREFIX/etc/mk.conf"
            tail -3 "$PREFIX/etc/mk.conf"
            df -h

            echo '##### 3. augeas を建てる #####'
            cd "$WORK/pkgsrc/sysutils/augeas"
            # 当て物の SHA1 を distinfo に入れる。pkgsrc 標準の的。
            bmake makepatchsum
            if bmake >/tmp/build.log 2>&1; then
              echo 'RESULT build: 通った'
            else
              echo 'RESULT build: 落ちた'
              grep -iE '_Unwind_|personality|undefined reference' /tmp/build.log | head -10
              tail -30 /tmp/build.log
            fi

            echo '##### 4. -fexceptions はどう扱われたか #####'
            find "$WORK/pkgsrc/sysutils/augeas/work" -name config.log -maxdepth 3 2>/dev/null | head -1 | while read l; do
              grep -i 'fexceptions\|asynchronous-unwind' "$l" | head -5
            done
            grep -rn 'common_flags=' "$WORK"/pkgsrc/sysutils/augeas/work/augeas-*/configure 2>/dev/null | head -2

            echo '##### 5. make test (= augeas の make check) #####'
            bmake install >/tmp/install.log 2>&1 || { echo '!! install に失敗'; tail -20 /tmp/install.log; }
            if bmake test >/tmp/test.log 2>&1; then
              echo 'RESULT test: 通った'
            else
              echo 'RESULT test: 落ちた'
            fi
            echo '--- 落ちたものを全部 ---'
            grep -E '^(FAIL|ERROR):' /tmp/test.log | sort -u
            grep -E '^# (TOTAL|PASS|SKIP|XFAIL|FAIL|XPASS|ERROR):' /tmp/test.log
            echo '--- lens のテスト ---'
            grep -E '(PASS|FAIL): lens-(simplevars|shellvars)' /tmp/test.log | sort -u

            echo '##### 6. この箱で解釈に失敗する設定ファイル #####'
            AUG=$PREFIX/bin/augtool
            echo "入った lens: $(ls $PREFIX/share/augeas/lenses/dist/*.aug 2>/dev/null | wc -l) 本"
            $AUG -e 'match /augeas/files//error' 2>&1 |
              sed -e 's|^/augeas/files||' -e 's|/error.*||' | sort -u
            echo '--- 言い分 ---'
            $AUG -e 'print /augeas/files//error' 2>&1 | head -40

            echo '##### 7. /etc/adduser.conf #####'
            # 素の OpenBSD には無い。adduser(8) に既定値で書かせる。
            [ -f /etc/adduser.conf ] || adduser -config_create -silent </dev/null || true
            if [ -f /etc/adduser.conf ]; then
              echo '--- 実物の頭 ---'; head -14 /etc/adduser.conf
              echo '--- augeas から見えるか ---'
              $AUG -e 'print /files/etc/adduser.conf' 2>&1 | head -25
              echo '--- error は出ていないか ---'
              $AUG -e 'print /augeas/files/etc/adduser.conf/error' 2>&1 | head -5
            else
              echo '(adduser.conf を作れなかった)'
            fi

            echo '##### 8. /etc/wsconsctl.conf #####'
            ls -l /etc/wsconsctl.conf 2>/dev/null || echo '(この箱には無い)'
            $AUG -e 'print /files/etc/wsconsctl.conf' 2>&1 | head -10

      - name: 転けたらログを出す
        if: failure()
        run: echo "VM の中のログは上の run 出力を見ること"

  freebsd:
    if: inputs.target == 'both' || inputs.target == 'freebsd'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # こちらは / が 199G あるので /root のままでよい。
      PREFIX: /opt/pkg
    steps:
      - uses: actions/checkout@v4

      - name: FreeBSD で bootstrap して augeas を建てる
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ inputs.freebsd_release }}
          mem: 8192
          cpu: 4
          sync: 'no'
          copyback: false
          envs: 'PREFIX'
          prepare: |
            df -h
          run: |
            set -x
            uname -a
            cc --version | head -2

            echo '##### 1. pkgsrc と overlay を取る #####'
            cd /root
            fetch -o pkgsrc.tar.gz https://cdn.NetBSD.org/pub/pkgsrc/${{ inputs.pkgsrc }}/pkgsrc.tar.gz
            tar xzf pkgsrc.tar.gz
            fetch -o overlay.tar.gz https://codeload.github.com/zakinko/pkgsrc-zakinko/tar.gz/refs/heads/main
            tar xzf overlay.tar.gz
            cp -Rf pkgsrc-zakinko-main/overlay/sysutils/augeas/. pkgsrc/sysutils/augeas/

            echo '##### 2. bootstrap #####'
            # README.FreeBSD: base の compiler のみ対応。ports の gcc は不可。
            cd /root/pkgsrc/bootstrap
            ./bootstrap --prefix "$PREFIX" --workdir /tmp/bs >/tmp/bootstrap.log 2>&1
            rc=$?
            echo "--- bootstrap の終了状態: $rc ---"
            tail -25 /tmp/bootstrap.log
            PATH=$PREFIX/bin:$PREFIX/sbin:$PATH
            export PATH
            # bootstrap は digest を入れない。makepatchsum が要るので先に建てる。
            ( cd /root/pkgsrc/pkgtools/digest && bmake install ) >/tmp/digest.log 2>&1 || {
              echo '!! pkgtools/digest を建てられなかった'; tail -30 /tmp/digest.log; exit 1; }
            for t in "$PREFIX/bin/bmake" "$PREFIX/bin/digest"; do
              if [ -x "$t" ]; then echo "  ok $t"
              else echo "!! $t が無い"; ls "$PREFIX/bin" "$PREFIX/sbin" 2>&1 | head -30; exit 1; fi
            done

            echo '##### 3. augeas を建てて試す #####'
            cd /root/pkgsrc/sysutils/augeas
            bmake makepatchsum
            if bmake >/tmp/build.log 2>&1; then echo 'RESULT build: 通った'; else
              echo 'RESULT build: 落ちた'; tail -30 /tmp/build.log; fi
            bmake install >/tmp/install.log 2>&1 || tail -20 /tmp/install.log
            if bmake test >/tmp/test.log 2>&1; then echo 'RESULT test: 通った'; else
              echo 'RESULT test: 落ちた'; fi
            grep -E '^(# TOTAL|# PASS|# FAIL)' /tmp/test.log | tail -5

            echo '##### 4. adduser.conf は FreeBSD では本当に shell #####'
            AUG=$PREFIX/bin/augtool
            [ -f /etc/adduser.conf ] || adduser -C -q </dev/null || true
            ls -l /etc/adduser.conf 2>/dev/null || echo '(無い)'
            head -20 /etc/adduser.conf 2>/dev/null
            echo '--- Simplevars で読めているか ---'
            $AUG -e 'print /files/etc/adduser.conf' 2>&1 | head -20
            $AUG -e 'print /augeas/files/etc/adduser.conf/error' 2>&1 | head -5

            echo '##### 5. この箱で解釈に失敗する設定ファイル #####'
            $AUG -e 'match /augeas/files//error' 2>&1 |
              sed -e 's|^/augeas/files||' -e 's|/error.*||' | sort -u

  # -fexceptions だけを見るための job。pkgsrc を通さず tarball を直に組む。
  # bootstrap 版は OpenBSD 7.9 で pkgsrc の devel/pkgconf が segfault して
  # configure まで届かなかった。ここは base の clang と OpenBSD の package
  # だけで組むので、その段を踏まずに済む。
  #
  # 分かるのは「この作りでリンクが通るか」までである。ports は自前の
  # LDFLAGS で組むので、これが通っても ports の patch が不要と断定は
  # できない。断定するには ports で patch を外して組む必要がある。
  openbsd-tarball:
    if: inputs.target == 'both' || inputs.target == 'openbsd' || inputs.target == 'openbsd-tarball'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: OpenBSD で augeas を tarball から組む
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ inputs.openbsd_release }}
          mem: 4096
          cpu: 4
          sync: 'no'
          copyback: false
          prepare: |
            # OpenBSD の package 名は libxml2 ではなく libxml。
            # pkg-config は base にある (usr.bin/pkgconf の PROG が pkg-config)。
            pkg_add -I libxml readline gmake
          run: |
            set -x
            uname -a
            cc --version | head -2

            echo '##### 0. _Unwind_* は今どこにあるか #####'
            # 2018 年の patch に添えられたログは libcompiler_rt の
            # __gcc_personality_v0 が _Unwind_* を引けない、というもの。
            # いま何が持っているかを先に見ておく。
            for l in /usr/lib/libc.so.* /usr/lib/libc++abi.so.* /usr/lib/libpthread.so.*; do
              [ -e "$l" ] || continue
              n=$(nm -D "$l" 2>/dev/null | grep -c '_Unwind_' || true)
              echo "  $l  _Unwind_* を $n 個"
            done
            ls -l /usr/lib/libcompiler_rt.a /usr/lib/libunwind* 2>/dev/null || echo '  (libcompiler_rt.a / libunwind は見当たらない)'

            cd /root
            ftp -o augeas.tar.gz https://github.com/hercules-team/augeas/releases/download/release-1.14.1/augeas-1.14.1.tar.gz
            tar xzf augeas.tar.gz

            echo '##### 1. 素のまま (-fexceptions あり) #####'
            cd /root/augeas-1.14.1
            grep -n 'common_flags=' configure | head -2
            ./configure --prefix=/tmp/a1 >c1.log 2>&1 || { tail -20 c1.log; exit 1; }
            grep -i 'understands -fexceptions\|fexceptions' c1.log | head -3
            if gmake >b1.log 2>&1; then
              echo 'RESULT A (-fexceptions あり): 通った'
            else
              echo 'RESULT A (-fexceptions あり): 落ちた'
              grep -iE '_Unwind_|personality|undefined' b1.log | head -12
              tail -20 b1.log
            fi

            echo '##### 2. OpenBSD の ports と同じく外す #####'
            gmake distclean >/dev/null 2>&1 || true
            sed -i 's|common_flags="-fexceptions -fasynchronous-unwind-tables"|common_flags=""|' configure
            ./configure --prefix=/tmp/a2 >c2.log 2>&1
            if gmake >b2.log 2>&1; then
              echo 'RESULT B (-fexceptions なし): 通った'
            else
              echo 'RESULT B (-fexceptions なし): 落ちた'
              tail -20 b2.log
            fi

            echo '##### 2b. 当て物なしのテストはどこまで通るか #####'
            # 当て物ありの側 (pkgsrc の job) で 4 件落ちる。それが配布物自身の
            # ものか、こちらが持ち込んだものかを見るには、素の状態の集合が要る。
            if gmake check >/tmp/chk.log 2>&1; then
              echo 'RESULT check: 通った'
            else
              echo 'RESULT check: 落ちた'
            fi
            grep -E '^(FAIL|ERROR):' /tmp/chk.log | sort -u
            grep -E '^# (TOTAL|PASS|SKIP|XFAIL|FAIL|XPASS|ERROR):' /tmp/chk.log

            echo '##### 2c. test の bash と sed を直したら変わるか #####'
            # 落ちる四件のうち三件は #!/bin/bash で、BSD に /bin/bash は無い。
            # test-augprint.sh に bashism は無く、test-createfile.sh の [[ ]] は
            # 四箇所とも -e と -z なので [ ] にできる。test-augtool.sh は
            # GSED=sed; type gsed && GSED=gsed という仕組みを既に持っているのに
            # 一箇所だけ素の sed を呼んでいる。直して通るのか、起動するように
            # なるだけで別の理由で落ちるのかを見る。
            for f in test-augprint.sh test-createfile.sh test-augtool.sh; do
              sed -i 's|^#!/bin/bash$|#!/bin/sh|' "tests/$f"
            done
            sed -i -e 's|\[\[ ! -e \(.*\) \]\]|[ ! -e "\1" ]|' \
                   -e 's|\[\[ -z \(.*\) \]\]|[ -z \1 ]|' tests/test-createfile.sh
            sed -i 's#| sed #| $GSED #' tests/test-augtool.sh
            echo '--- 直したあと ---'
            head -1 tests/test-augprint.sh tests/test-createfile.sh tests/test-augtool.sh
            echo "  残った [[ : $(grep -c '\[\[' tests/test-createfile.sh)"
            grep -n 'GSED' tests/test-augtool.sh
            if gmake check >/tmp/chk2.log 2>&1; then
              echo 'RESULT check(直した後): 通った'
            else
              echo 'RESULT check(直した後): 落ちた'
            fi
            grep -E '^(FAIL|ERROR):' /tmp/chk2.log | sort -u
            grep -E '^# (TOTAL|PASS|SKIP|FAIL):' /tmp/chk2.log

            echo '##### 2d. では何が原因なのか #####'
            # bash と sed の見立ては外れた。直しても同じ四件が落ちる。
            # そもそも bash が居るのかどうかから見て、automake が残す
            # 各テストの .log を読む。
            echo '--- bash はあるか ---'
            ls -l /bin/bash /usr/local/bin/bash 2>&1 | head -3
            command -v bash gsed 2>&1 | head -3
            for t in test-augprint test-augtool test-createfile test-idempotent; do
              echo "--- tests/$t.sh.log ---"
              tail -25 "tests/$t.sh.log" 2>/dev/null || echo '  (log が無い)'
            done

            echo '##### 3. 結論 #####'
            echo 'A が落ちて B が通れば patch はいまも要る。'
            echo 'A が通れば、2018 年の状況は再現しない。'


  # -fexceptions の検査をどう書けば本当に落ちるかを測る job。
  #
  # 上流の AUGEAS_COMPILE_WARNINGS は、フラグごとに main(){} だけの
  # プログラムを compile+link して受理を決めている。-fexceptions を付けても
  # その main は例外表を作らないので __gcc_personality_v0 を引かず、検査は
  # 通ってしまう。本体をリンクする段になって初めて libcompiler_rt.a の
  # __gcc_personality_v0 が _Unwind_* を引けずに落ちる。OpenBSD 7.9 で
  # 再現済み。
  #
  # 検査を直すには、-fexceptions を付けたときに実際に personality を引く
  # プログラムで試すしかない。どの書き方なら引くのかをここで見る。
  openbsd-probe:
    if: inputs.target == 'openbsd-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 新しい検査を Linux/glibc で試す
        run: |
          # 上流に出す検査。ここ (glibc) では yes になるはず。
          cat > /tmp/p.c <<'EOF'
          extern void __gcc_personality_v0(void);
          int main(void) { __gcc_personality_v0(); return 0; }
          EOF
          if cc -o /tmp/p /tmp/p.c 2>/tmp/p.log; then
            echo 'CHECK linux/glibc: __gcc_personality_v0 リンクできる -> flags は残る'
          else
            echo 'CHECK linux/glibc: リンクできない -> flags は落ちる'; head -5 /tmp/p.log
          fi

      - name: time_t が long より広い環境で %ld を試す
        run: |
          # NetBSD/i386 や OpenBSD/i386 は long が 32bit で time_t が 64bit。
          # vmactions にその image が無いので、glibc の 64bit time_t を
          # -m32 で使って同じ形を作る。
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-multilib
          cat > /tmp/t.c <<'CEOF'
          #include <stdio.h>
          #include <sys/time.h>
          void f(const struct timeval *a, const struct timeval *b) {
              time_t elapsed = (b->tv_sec - a->tv_sec)*1000
                             + (b->tv_usec - a->tv_usec)/1000;
              printf("Time: %ld ms\n", elapsed);
          }
          CEOF
          echo '--- 幅の確認 ---'
          cat > /tmp/w.c <<'CEOF'
          #include <stdio.h>
          #include <time.h>
          int main(void) { printf("long=%zu time_t=%zu\n",
                                  sizeof(long), sizeof(time_t)); return 0; }
          CEOF
          gcc -m32 -D_FILE_OFFSET_BITS=64 -D_TIME_BITS=64 -o /tmp/w /tmp/w.c \
            && /tmp/w
          echo '--- いまのコード (%ld) ---'
          gcc -m32 -D_FILE_OFFSET_BITS=64 -D_TIME_BITS=64 -Wall -Wformat \
              -c -o /tmp/t.o /tmp/t.c 2>&1 | head -8
          echo '--- 直したあと ((long long) つき) ---'
          sed -e 's|%ld ms|%lld ms|' -e 's|, elapsed)|, (long long) elapsed)|' \
              /tmp/t.c > /tmp/t2.c
          gcc -m32 -D_FILE_OFFSET_BITS=64 -D_TIME_BITS=64 -Wall -Wformat \
              -c -o /tmp/t2.o /tmp/t2.c 2>&1 | head -8
          echo '  (直したあとに何も出なければ警告なし)'

      - name: OpenBSD で検査の書き方を測る
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ inputs.openbsd_release }}
          mem: 2048
          cpu: 2
          sync: 'no'
          copyback: false
          run: |
            set -x
            cc --version | head -2
            cd /tmp

            # 候補 0: 上流がいま使っているもの
            printf 'int main(void) { return 0; }\n' > p0.c

            # 候補 1: cleanup 属性。-fexceptions があると landing pad が出る
            printf '%s\n' \
              'static void f(int *p) { (void) p; }' \
              'extern int g(void);' \
              'int g(void) { return 0; }' \
              'int main(void) { int x __attribute__((cleanup(f))) = 0; return g() + x; }' \
              > p1.c

            # 候補 2: personality を名指しで引く
            printf '%s\n' \
              'extern int __gcc_personality_v0(void);' \
              'int main(void) { return __gcc_personality_v0() != 0; }' \
              > p2.c

            for f in p0 p1 p2; do
              for opt in "" "-fexceptions -fasynchronous-unwind-tables"; do
                if cc $opt -o /tmp/$f.bin /tmp/$f.c >/tmp/$f.log 2>&1; then
                  r="通った"
                else
                  r="落ちた (未定義 $(grep -c 'undefined symbol' /tmp/$f.log) 個)"
                fi
                printf 'PROBE %-3s flags=[%s] -> %s\n' "$f" "$opt" "$r"
              done
            done
            echo '--- 望ましいのは flags 無しで通り、flags 有りで落ちる候補 ---'

            # 上流に出す検査そのもの。ここでは no になるはず。
            if cc -o /tmp/p2b /tmp/p2.c >/tmp/p2b.log 2>&1; then
              echo 'CHECK openbsd: __gcc_personality_v0 リンクできる -> flags は残る'
            else
              echo 'CHECK openbsd: リンクできない -> flags は落ちる'
              head -4 /tmp/p2b.log
            fi

  # NetBSD/i386 の実機で -Wformat が何を言うかを見る。手元の pkgsrc には
  # 既に当て物が入っていて build.yml では警告の出る状態を作れないので、
  # pkgsrc を通さず素の五行を直に組む。イメージは netbsd-ci-images から。
  netbsd-i386:
    if: inputs.target == 'netbsd-i386'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::KVM 無し。相当遅い"

      - name: NetBSD/i386 で -Wformat を見る
        run: sh ci/netbsd-i386-format.sh i386-11.0
