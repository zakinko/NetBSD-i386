name: mozc334

# mozc 3.34.6239 を gyp で建てる。i386 で通るかを見るのが主目的。
#
# 3.34 に gyp は無い。zakinko/mozc-server334 が 3.33.6089 の tarball から
# 足場だけを写して建てる。bazel を一度も呼ばないので、singlejar の
#
#	#error This code for 64 bit Unix.
#
# は効かない。効かないことと実際に i386 で建つことは別で、それを測る。
# amd64 では techne で 690/690 まで建ち、変換まで確かめてある。
#
# 手で起動する。押すまで何もしない。qemu で NetBSD を起動して mozc を
# 二回組むので、一 job あたり数時間かかる。
#
# 既定は i386-11.0 の一つだけにしてある。六つ並べて数時間ずつ払っても、
# 最初に分かるのは「i386 で建つか」の一ビットで、そこで転ければ残りは
# 同じ所で転ける。通ってから広げる。

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'どのイメージで回すか (i386 は i386 の三版、all は六つ)'
        type: choice
        options: [i386-11.0, i386, all, i386-10.1, i386-9.4, amd64-11.0, amd64-10.1, amd64-9.4]
        default: i386-11.0
      emacs:
        description: 'どの emacs で測るか'
        type: choice
        options: [emacs30nox, emacs29nox, emacs31nox]
        default: emacs30nox

# 押し直したら前のは捨てる。VM を二つ抱えたまま二周させない。
concurrency:
  group: mozc334-${{ github.ref }}-${{ inputs.image }}-${{ inputs.emacs }}
  cancel-in-progress: true

jobs:
  mozc334:
    runs-on: ubuntu-latest
    # techne (実機 3 core) で server 690 ターゲットに 40 分、elisp も同じ木を
    # 建て直すので同程度。qemu の i386 では数倍を見る。
    timeout-minutes: 350
    strategy:
      # 一版で落ちても他の結果は見たい。どの版で落ちてどの版で通るかが
      # 分からないと切り分けにならない。
      fail-fast: false
      matrix:
        image: >-
          ${{ inputs.image == 'all'
              && fromJSON('["i386-11.0","i386-10.1","i386-9.4","amd64-11.0","amd64-10.1","amd64-9.4"]')
              || (inputs.image == 'i386'
                  && fromJSON('["i386-11.0","i386-10.1","i386-9.4"]')
                  || fromJSON(format('["{0}"]', inputs.image))) }}
    name: ${{ matrix.image }} ${{ inputs.emacs }}
    steps:
      - uses: actions/checkout@v4

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::KVM 無し。相当遅い"

      - name: 空きを作る
        run: |
          # 334 は distfile を二本取る (3.34.6239 と 3.33.6089) ので、
          # 333 より太る。runner の / は狭い。
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: ${{ matrix.image }} で ${{ inputs.emacs }} を測る
        run: sh ci/netbsd-mozc334.sh '${{ matrix.image }}' '${{ inputs.emacs }}'
