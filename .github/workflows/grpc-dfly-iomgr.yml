# grpc#43396: DragonFly で iomgr の dual-stack を、直す前と後で測る。
name: grpc-dfly-iomgr
on:
  workflow_dispatch:
concurrency:
  group: grpc-dfly-iomgr
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          envs: 'GITHUB_WORKSPACE'
          cpu: 4
          mem: 12288
          prepare: pkg install -y cmake ninja git perl5 go coreutils llvm19
          run: sh "$GITHUB_WORKSPACE/ci/grpc-dfly-iomgr/run.sh"
