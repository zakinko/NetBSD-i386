name: pkgsrc-issues

# NetBSD/pkgsrc の GitHub issues のうち、手元で再現できるものを実機で採る。
#
# ここは「直す」前の段である。まず落とす。落ちる形を見てから直しを書く。
#
#   #166  FreeBSD で Variable OBJECT_FMT is recursive
#   #126  HP-UX で Variable OS_VERSION is recursive (別ジョブ。HP-UX は qemu)
#   #130 #132 #141  musl/busybox の箱で bootstrap が nawk を見つけられない
#
# #166 についての読み。mk/bsd.prefs.mk は
#
#   459  .include <bsd.own.mk>
#   464  NATIVE_OBJECT_FMT:=	${OBJECT_FMT}
#   466  OBJECT_FMT=	${... ? ${CROSS_OBJECT_FMT} : ${NATIVE_OBJECT_FMT}}
#   ...
#   504  .elif ${OPSYS} == "FreeBSD"
#   505  OBJECT_FMT?=	ELF
#
# の順で書かれている。466 で OBJECT_FMT が無条件に定義されるので、505 の
# `?=` は空振りする。同じ並びで DragonFly (507) Minix (509) Linux (511)
# AIX (513) OSF1 (515) HPUX (516-) は素の `=` を使っていて効いている。
# `?=` なのは FreeBSD (505) と OpenBSD (500,502) の二つだけである。
#
# 再帰そのものは、再帰した make で OBJECT_FMT が未展開のまま環境から
# 入ってきた場合に 464 が ${NATIVE_OBJECT_FMT} を含む文字列を
# NATIVE_OBJECT_FMT へ代入することで閉じる、というのがこちらの読み。
# 報告者の traceback が mk/platform/FreeBSD.mk:17 (`.if ${OBJECT_FMT} ==
# "ELF"`) を指しているのと合う。ただし bmake の評価順の話なので、読みだけ
# では確証にならない。だから実機で採る。
#
# OpenBSD も同じ `?=` なので、報告は無いが同じ形で落ちるはずである。
# 落ちるなら「FreeBSD だけの話ではない」という材料になり、落ちないなら
# 上の読みが違うということになる。どちらでも収穫がある。
#
# 手で起動する。押すまで何もしない。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'どれを回すか'
        type: choice
        options: [all, freebsd, openbsd, musl, hpux, fix130, fix165, fix178]
        default: all
      pkgsrc:
        description: 'pkgsrc の配布物 (current か stable)'
        type: choice
        options: [current, stable]
        default: current
      freebsd_release:
        description: 'FreeBSD の版'
        default: '14.3'
      openbsd_release:
        description: 'OpenBSD の版'
        default: '7.9'

jobs:
  # ------------------------------------------------------------------
  # #166  FreeBSD
  # ------------------------------------------------------------------
  freebsd:
    if: inputs.target == 'all' || inputs.target == 'freebsd'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PREFIX: /opt/pkg
    steps:
      - uses: actions/checkout@v4

      - name: FreeBSD で OBJECT_FMT を採る
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ inputs.freebsd_release }}
          mem: 8192
          cpu: 4
          sync: 'no'
          copyback: false
          envs: 'PREFIX'
          run: |
            set -x
            uname -a

            echo '##### 1. pkgsrc を取る #####'
            cd /root
            fetch -o pkgsrc.tar.gz https://cdn.NetBSD.org/pub/pkgsrc/${{ inputs.pkgsrc }}/pkgsrc.tar.gz
            tar xzf pkgsrc.tar.gz

            echo '##### 2. bootstrap #####'
            cd /root/pkgsrc/bootstrap
            ./bootstrap --prefix "$PREFIX" --workdir /tmp/bs >/tmp/bootstrap.log 2>&1
            echo "--- bootstrap の終了状態: $? ---"
            tail -15 /tmp/bootstrap.log
            PATH=$PREFIX/bin:$PREFIX/sbin:$PATH
            export PATH

            echo '##### 3. 報告者と同じ操作 (issue #166) #####'
            # 報告は misc/fd で bmake clean が
            #   Variable OBJECT_FMT is recursive.
            #     in mk/platform/FreeBSD.mk:17
            # と言って落ちる、というもの。
            cd /root/pkgsrc/misc/fd
            if bmake clean >/tmp/clean.log 2>&1; then
              echo 'RESULT #166: 落ちなかった'
            else
              echo 'RESULT #166: 落ちた'
            fi
            cat /tmp/clean.log

            echo '##### 4. OBJECT_FMT が実際に何になっているか #####'
            # ここが空なら 505 の `?=` が空振りしているということ。
            for v in OBJECT_FMT NATIVE_OBJECT_FMT CROSS_OBJECT_FMT USE_CROSS_COMPILE; do
              printf '%-20s = [%s]\n' "$v" "$(bmake -V "$v" 2>&1)"
            done

            echo '##### 5. 上の階層 (mk/ を直に読ませる) #####'
            cd /root/pkgsrc/misc/fd
            bmake show-vars VARNAMES='OPSYS OBJECT_FMT NATIVE_OBJECT_FMT' 2>&1 | head -20

            echo '##### 6. どちらの bsd.own.mk を掴んでいるか #####'
            # 一回目で分かったこと。OBJECT_FMT を置いているのは pkgsrc 自身の
            # bsd.own.mk であって (bootstrap-mk-files の mods/bsd.own.mk.in:115
            # が "All platforms are ELF" として無条件に ELF を置く)、FreeBSD
            # base の /usr/share/mk/bsd.own.mk は OBJECT_FMT を一切定義しない。
            #
            # つまり再帰するかどうかは pkgsrc の版ではなく、.include <bsd.own.mk>
            # がどちらを掴むかで決まるはずである。既に closed の issue #134
            # (bmake が /usr/share/mk を読んで Malformed conditional) が同じ系統。
            # 報告者の /home/marc/pkgsrc という非特権 prefix も条件に合う。
            echo '--- それぞれの bsd.own.mk ---'
            ls -l "$PREFIX/share/mk/bsd.own.mk" /usr/share/mk/bsd.own.mk 2>&1
            echo "  pkgsrc 側の OBJECT_FMT: $(grep -c OBJECT_FMT "$PREFIX/share/mk/bsd.own.mk" 2>/dev/null) 件"
            echo "  base 側の OBJECT_FMT:   $(grep -c OBJECT_FMT /usr/share/mk/bsd.own.mk 2>/dev/null) 件"

            echo '--- base の /usr/share/mk を掴ませたらどうなるか ---'
            cd /root/pkgsrc/misc/fd
            if bmake -m /usr/share/mk clean >/tmp/base-mk.log 2>&1; then
              echo 'RESULT #166 (base の mk): 落ちなかった'
            else
              echo 'RESULT #166 (base の mk): 落ちた'
            fi
            head -20 /tmp/base-mk.log

  # ------------------------------------------------------------------
  # #166 の裏取り  OpenBSD も同じ `?=` を使っている
  # ------------------------------------------------------------------
  openbsd:
    if: inputs.target == 'all' || inputs.target == 'openbsd'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # / が 986M しかない。空いているのは /home。augeas-bsd.yml と同じ。
      PREFIX: /home/pkg
    steps:
      - uses: actions/checkout@v4

      - name: OpenBSD で OBJECT_FMT を採る
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ inputs.openbsd_release }}
          mem: 8192
          cpu: 4
          sync: 'no'
          copyback: false
          envs: 'PREFIX'
          run: |
            set -x
            uname -a
            df -h /home

            echo '##### 1. pkgsrc を取る #####'
            mkdir -p /home/work && cd /home/work
            ftp -o pkgsrc.tar.gz https://cdn.NetBSD.org/pub/pkgsrc/${{ inputs.pkgsrc }}/pkgsrc.tar.gz
            tar xzf pkgsrc.tar.gz

            echo '##### 2. bootstrap #####'
            cd /home/work/pkgsrc/bootstrap
            ./bootstrap --prefix "$PREFIX" --workdir /home/work/bs >/tmp/bootstrap.log 2>&1
            echo "--- bootstrap の終了状態: $? ---"
            tail -15 /tmp/bootstrap.log
            # README.OpenBSD: pkgsrc の pkg_* が base と衝突する。base を
            # 退避すると fw_update(1) が壊れるので PATH の順で避ける。
            PATH=$PREFIX/bin:$PREFIX/sbin:$PATH
            export PATH

            echo '##### 3. OBJECT_FMT が実際に何になっているか #####'
            # 500/502 が `?=` なので、FreeBSD と同じなら空になるはず。
            cd /home/work/pkgsrc/misc/fd
            if bmake clean >/tmp/clean.log 2>&1; then
              echo 'RESULT OpenBSD: 落ちなかった'
            else
              echo 'RESULT OpenBSD: 落ちた'
            fi
            cat /tmp/clean.log
            for v in OBJECT_FMT NATIVE_OBJECT_FMT ELF_TOOLCHAIN; do
              printf '%-20s = [%s]\n' "$v" "$(bmake -V "$v" 2>&1)"
            done

  # ------------------------------------------------------------------
  # #130 #132 #141  musl / busybox の箱で bootstrap
  # ------------------------------------------------------------------
  #
  # bootstrap/bootstrap の awk 判定は今も
  #
  #   707  if [ -f /etc/debian_version ]; then need_awk=yes
  #   711  elif [ -f /etc/arch-release ]; then need_awk=yes; need_pax=yes
  #   716  elif grep -sq '^CHROMEOS_RELEASE_NAME' /etc/lsb-release; then ...
  #
  # という配布物名のハードコードだけで、musl/busybox の分岐が無い。
  # busybox awk は pkgsrc/mk が使う正規表現を解さないのに native awk として
  # 採られてしまう、というのが報告の筋。
  #
  # Alpine (busybox あり) と Adélie (musl だが busybox 無し) の二つで採る。
  # 報告者が両方で同じ症状を出しているので、原因が busybox なのか musl なのか
  # をここで分けられる。
  musl:
    if: inputs.target == 'all' || inputs.target == 'musl'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine
            image: alpine:3.21
            setup: apk add --no-cache build-base file zlib-dev
          - name: debian-mawk
            # 対照。Debian は mawk だが 707 のハードコードで need_awk=yes に
            # なるので通る。ここが通って alpine が落ちれば、原因は awk の
            # 実装ではなく判定の書き方だと言える。
            image: debian:12
            setup: apt-get update && apt-get install -y build-essential file zlib1g-dev curl
    container:
      image: ${{ matrix.image }}
    steps:
      - name: ${{ matrix.name }} で bootstrap する
        run: |
          set -x
          ${{ matrix.setup }}
          cat /etc/os-release 2>/dev/null | head -3
          echo "--- awk は何か ---"
          command -v awk gawk nawk mawk 2>&1 || true
          ls -l "$(command -v awk)" 2>&1 || true
          awk --version 2>&1 | head -2 || awk -W version 2>&1 | head -2 || true

          echo '##### pkgsrc を取る #####'
          cd /tmp
          (wget -q -O pkgsrc.tar.gz https://cdn.NetBSD.org/pub/pkgsrc/${{ inputs.pkgsrc }}/pkgsrc.tar.gz \
            || curl -fsSL -o pkgsrc.tar.gz https://cdn.NetBSD.org/pub/pkgsrc/${{ inputs.pkgsrc }}/pkgsrc.tar.gz)
          tar xzf pkgsrc.tar.gz

          echo '##### bootstrap の awk 判定がどう転ぶか #####'
          grep -n 'need_awk=yes' /tmp/pkgsrc/bootstrap/bootstrap | head
          for f in /etc/debian_version /etc/arch-release /etc/lsb-release; do
            [ -e "$f" ] && echo "  ある: $f" || echo "  無い: $f"
          done

          echo '##### bootstrap #####'
          cd /tmp/pkgsrc/bootstrap
          if ./bootstrap --prefix /opt/pkg --workdir /tmp/bs >/tmp/bootstrap.log 2>&1; then
            echo "RESULT ${{ matrix.name }}: bootstrap は通った"
          else
            echo "RESULT ${{ matrix.name }}: bootstrap が落ちた"
          fi
          tail -40 /tmp/bootstrap.log
          echo '--- nawk を探しているか ---'
          grep -n -i 'nawk\|awk' /tmp/bootstrap.log | tail -20

  # ------------------------------------------------------------------
  # #126  HP-UX で Variable OS_VERSION is recursive
  # ------------------------------------------------------------------
  #
  # 報告は HP-UX 11.31 だが、手元にあるのは 11i v1 (11.11) と 10.20 で、
  # どちらも hppa である。11.31 は Itanium で使われることが多く qemu では
  # 動かないので、そもそも狙えない。効くのは uname -r が B.11.x を返すこと
  # だけ (mk/bsd.prefs.mk:267-268 の :C/^B.//) なので 11i v1 でよい。
  # GNATS の pkg/59002 も 11.11 なので突き合わせる相手も揃う。
  #
  # ただし #166 で学んだとおり、効いている軸が OS の版とは限らない。報告者が
  # 出した
  #
  #   bmake: Unknown modifier 'C'
  #
  # は :C/// を解さない古い make の言い分で、今の bmake は解する。再現しな
  # ければ次に振るのは HP-UX の版ではなく pkgsrc と bmake の年代である。
  #
  # ここでやるのはまず起動である。SUPPORT.md が「pkgsrc の bootstrap が
  # HP-UX で通るか」を未確認の側に置いているとおり、通った実績がまだ無い。
  # 「駄目でした」で終わらせず、どこで止まったかを残す。
  #
  # 媒体の取得元は secret の MEDIA_BASE で渡す。netbsd-ci-images の
  # fetch-media.sh が ::add-mask:: と sed で URL とホスト名を伏せるので、
  # それをそのまま使い、こちらでは書かない。
  #
  # **落としたものを artifact にも release にも上げないこと。** 商用 Unix の
  # 媒体は配布元が再配布を許諾していない。上げるとログを伏せる意味も消える。
  hpux:
    if: inputs.target == 'all' || inputs.target == 'hpux'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # -d nochain は TCG の TB 連結を切る debug 用の指定で、実行が
          # 桁で遅くなる。配布元の .sh に入っていたので最初はそのまま
          # 残したが、19 分沈黙した原因がこれである見込みがある。
          - name: nochain
            dbg: '-d nochain'
          - name: plain
            dbg: ''
    steps:
      - name: qemu と lzip を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-hppa lzip
          qemu-system-hppa --version | head -1
          df -h / /mnt 2>&1 | head -5

      - name: fetch-media.sh を借りる
        uses: actions/checkout@v4
        with:
          repository: zakinko/netbsd-ci-images
          path: ci-images

      - name: 媒体を取る
        env:
          MEDIA_BASE: ${{ secrets.MEDIA_BASE }}
          MEDIA_DIR: /mnt/media
          MEDIA_PATHS: ${{ runner.temp }}/media-paths.conf
          MEDIA_SUBDIR: ${{ secrets.MEDIA_HPUX_DIR }}
          MEDIA_FILE: ${{ secrets.MEDIA_HPUX_FILE }}
        run: |
          # set -x は使わない。展開後の URL と名前がログに出る。
          #
          # 取得元だけでなく、そこでの位置と名前も伏せる。名前は十分に
          # 特徴的なので、それだけで取得元が引ける。GitHub は secret の値を
          # 自動で伏字にするが、fetch-media.sh に倣って ::add-mask:: も明示
          # しておく。二重にしておけば、どちらかの扱いが変わっても残る。
          for v in "$MEDIA_BASE" "$MEDIA_SUBDIR" "$MEDIA_FILE"; do
            [ -n "$v" ] || { echo '!! secret が空。三つとも要る。'; exit 1; }
            echo "::add-mask::$v"
          done
          sudo mkdir -p /mnt/media /mnt/work
          sudo chown "$(id -u):$(id -g)" /mnt/media /mnt/work

          # fetch-media.sh は「手元での置き場 -> 取得元のディレクトリ」の
          # 対応表を読む。実体はどこにも書けないので secret から起こす。
          # 対応表は .gitignore 済みで、向こうの CI も secret から書き出す。
          printf '%s\t%s\n' "HPUX/qemu/$MEDIA_FILE" "$MEDIA_SUBDIR" > "$MEDIA_PATHS"
          sh ci-images/fetch-media.sh --for "HPUX/qemu/$MEDIA_FILE"

          # 中立な名前へ移す。以後の段は secret 由来の名前を一切扱わないので、
          # 展開でも起動でも出しようがなくなる。
          mv "/mnt/media/HPUX/qemu/$MEDIA_FILE" /mnt/work/media.tar.lz
          sudo rm -rf /mnt/media && rm -f "$MEDIA_PATHS"
          echo "取れた大きさ: $(wc -c < /mnt/work/media.tar.lz) バイト"

      - name: 展開する
        run: |
          set -x
          cd /mnt/work
          # 中身は配布元の作りで .img と .sh の二つ。.sh には
          # qemu の引数しか入っていないが、名前をそのまま残す理由も無いので
          # 中立な名前へ移し、qemu の行はこちらのものを使う。
          lzip -dc media.tar.lz | tar -xf -
          mv ./*.img disk.img
          rm -f media.tar.lz ./*.sh
          ls -l /mnt/work
          df -h /mnt | tail -1

      - name: 起動して console を採る
        run: |
          cd /mnt/work
          ls -l disk.img
          : > /tmp/console.log

          # 配布元の .sh をもとに、CI 向けに三つ変える。
          #   -display none -serial file:  画面が無いので console を採る
          #   hostfwd                      後で ssh で入れるなら要る
          #   -d nochain                   配布元のものをそのまま残す
          # B160L は UART を二つ持つ (LASI と DINO)。SeaBIOS が喋るのと
          # HP-UX が console にするのが同じとは限らないので、両方採る。
          # 一本しか採らずに「何も出ない」と読むと、出ているのに見えて
          # いないだけ、を見落とす。
          : > /tmp/console1.log
          qemu-system-hppa \
            -machine B160L \
            -smp cpus=4 \
            -accel tcg,thread=multi \
            -boot c -boot menu=off \
            -drive if=scsi,bus=0,index=6,file=disk.img,format=qcow2 \
            -m 512 \
            ${{ matrix.dbg }} \
            -nic user,model=tulip,hostfwd=tcp:127.0.0.1:2222-:22 \
            -display none \
            -serial file:/tmp/console.log \
            -serial file:/tmp/console1.log \
            -pidfile /tmp/qemu.pid &
          QPID=$!

          # 起動できたかどうかは先に見る。前回ここで qemu が即死したのに、
          # 「止まっても job は失敗させない」ようにしていたせいで step が
          # success になり、失敗が success の顔をして通り抜けた。起動しない
          # のは調べる前の段の誤りなので、そこは落とす。
          sleep 20
          if ! kill -0 "$QPID" 2>/dev/null; then
            echo '!! qemu が起動しなかった'
            cat /tmp/console.log
            exit 1
          fi

          # ここから先は hppa が TCG で遅いだけなので、どこまで進んだかを
          # 残せれば足りる。login: に届かなくても job は落とさない。
          for i in $(seq 1 45); do
            sleep 60
            printf '=== %d 分経過  serial0 %s / serial1 %s バイト ===\n' \
              "$i" "$(wc -c < /tmp/console.log)" "$(wc -c < /tmp/console1.log)"
            tail -3 /tmp/console.log
            [ -s /tmp/console1.log ] && { echo '--- serial1 ---'; tail -3 /tmp/console1.log; }
            if ! kill -0 "$QPID" 2>/dev/null; then
              echo 'RESULT #126: qemu が途中で終了した'; break
            fi
            if grep -qs 'login:' /tmp/console.log /tmp/console1.log; then
              echo 'RESULT #126: login: まで来た'; break
            fi
          done

          kill "$QPID" 2>/dev/null || true
          echo '##### serial0 の全文 #####'
          cat /tmp/console.log
          echo '##### serial1 の全文 #####'
          cat /tmp/console1.log

  # ------------------------------------------------------------------
  # #130 #132 #141  の直しを検証する
  # ------------------------------------------------------------------
  #
  # 原因は bootstrap/bootstrap の awk 判定が配布物名 (/etc/debian_version,
  # /etc/arch-release, CHROMEOS_RELEASE_NAME) のハードコードだけで、musl や
  # busybox の箱を拾えないこと。gawk を持たない Alpine 等では
  # mk/tools/tools.Linux.mk:289 の
  #
  #   TOOLS_PLATFORM.awk?= ${TOOLS_PLATFORM.gawk}
  #
  # が空になり、awk が $PREFIX/bin/nawk に落ちるが、それは need_awk=yes の
  # ときにしか建たない。よって nawk: not found で止まる。
  #
  # 直しは Linux の分岐に一つ足すだけ。既知マーカーに当たらず、かつ gawk が
  # 無いときだけ need_awk=yes にする。tools.Linux.mk が Linux で gawk を
  # awk に使う以上、gawk の有無で判定するのが筋が通る。
  #
  #   Alpine (busybox, gawk 無し) -> need_awk=yes -> nawk を建てる -> 直る
  #   Enterprise Linux (gawk あり) -> need_awk=no のまま -> 退行なし
  #   Debian (mawk)               -> /etc/debian_version で従来どおり yes
  #
  # alarixnia@ が issue で釘を刺した「Enterprise Linux を壊すな」に応える形。
  # Fedora を Enterprise Linux の代役にして、直しても need_awk が no のままな
  # ことを確かめる。
  fix130:
    if: inputs.target == 'all' || inputs.target == 'fix130'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine-fixed        # 直る側
            image: alpine:3.21
            setup: apk add --no-cache build-base file zlib-dev
            expect: pass
          - name: fedora-noregress    # gawk あり。need_awk は no のまま
            image: fedora:41
            setup: dnf -y install gcc make file zlib-devel gawk diffutils >/dev/null
            expect: no-nawk
          - name: debian-unchanged    # mawk。従来どおり yes
            image: debian:12
            setup: apt-get update && apt-get install -y build-essential file zlib1g-dev curl
            expect: pass
    container:
      image: ${{ matrix.image }}
    steps:
      - name: ${{ matrix.name }} で直しを当てて bootstrap する
        run: |
          set -x
          ${{ matrix.setup }}
          command -v gawk >/dev/null 2>&1 && echo "gawk: あり" || echo "gawk: 無し"

          cd /tmp
          (wget -q -O pkgsrc.tar.gz https://cdn.NetBSD.org/pub/pkgsrc/${{ inputs.pkgsrc }}/pkgsrc.tar.gz \
            || curl -fsSL -o pkgsrc.tar.gz https://cdn.NetBSD.org/pub/pkgsrc/${{ inputs.pkgsrc }}/pkgsrc.tar.gz)
          tar xzf pkgsrc.tar.gz
          cd /tmp/pkgsrc/bootstrap

          echo '##### 直しを当てる (gawk 無しの Linux で need_awk=yes) #####'
          # ChromeOS の判定の直後、次の "Some distros, eg. OpenWRT" コメントの
          # 手前に一段はさむ。アンカーが安定しているので sed で入れる。
          awk '
            /# Some distros, eg\. OpenWRT provide no groups/ && !done {
              print "\t# mk/tools/tools.Linux.mk uses gawk as awk on Linux; distros whose"
              print "\t# only awk is busybox/mawk and which ship no gawk (Alpine, OpenWrt,"
              print "\t# Adelie, ...) otherwise leave awk pointing at an unbuilt nawk."
              print "\tif [ \"$need_awk\" = no ] && ! command -v gawk >/dev/null 2>&1; then"
              print "\t\tneed_awk=yes"
              print "\tfi"
              done=1
            }
            { print }
          ' bootstrap > bootstrap.new && mv bootstrap.new bootstrap && chmod +x bootstrap
          grep -n -A2 "only awk is busybox" bootstrap

          echo '##### bootstrap #####'
          if ./bootstrap --prefix /opt/pkg --workdir /tmp/bs >/tmp/bootstrap.log 2>&1; then
            echo "RESULT ${{ matrix.name }}: bootstrap 完走"
          else
            echo "RESULT ${{ matrix.name }}: bootstrap が途中で止まった"
          fi
          echo '--- nawk: not found が消えたか (#130 の症状) ---'
          if grep -q 'nawk: not found' /tmp/bootstrap.log; then
            echo "!! まだ nawk: not found が出ている (直っていない)"
          else
            echo "ok: nawk: not found は出ていない"
          fi
          echo '--- need_awk がどうなったか ---'
          grep -n 'Bootstrapping awk' /tmp/bootstrap.log && echo "=> nawk を建てた (need_awk=yes)" || echo "=> nawk は建てていない (need_awk=no)"
          tail -25 /tmp/bootstrap.log

  # ------------------------------------------------------------------
  # #165  libLLVM (llvm-13) が musl で ::lseek64 未宣言で落ちる
  # ------------------------------------------------------------------
  #
  # llvm/lib/Support/raw_ostream.cpp の raw_fd_ostream::seek は
  #
  #   #elif defined(HAVE_LSEEK64)
  #     pos = ::lseek64(FD, off, SEEK_SET);
  #
  # と書く。HAVE_LSEEK64 は cmake がシンボルの有無で立てる。musl は lseek64 を
  # シンボルとしては持つ (だから HAVE_LSEEK64 が立つ) が、unistd.h は
  # _GNU_SOURCE / _LARGEFILE64_SOURCE が無いと lseek64 を宣言しない。よって
  # ::lseek64 が「未宣言」で compile error になる。glibc は既定で宣言するので
  # 起きない。llvm-13 を全部建てず、その一文だけを同じ条件で compile して
  # 再現する。
  fix165:
    if: inputs.target == 'all' || inputs.target == 'fix165'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine-musl
            image: alpine:3.21
            setup: apk add --no-cache build-base
          - name: debian-glibc
            image: debian:12
            setup: apt-get update && apt-get install -y g++
    container:
      image: ${{ matrix.image }}
    steps:
      - name: ${{ matrix.name }} で ::lseek64 を試す
        run: |
          set -x
          ${{ matrix.setup }}
          cat /etc/os-release | head -1
          # raw_ostream.cpp:807 と同じ使い方を最小で再現
          cat > seek.cpp <<'CPP'
          #include <unistd.h>
          // llvm-13 の cmake が HAVE_LSEEK64 を立てた状況を模す
          #define HAVE_LSEEK64
          long test_seek(int FD, long off) {
          #ifdef HAVE_LSEEK64
            return ::lseek64(FD, off, SEEK_SET);
          #else
            return ::lseek(FD, off, SEEK_SET);
          #endif
          }
          CPP
          echo '##### 1. 素の compile (llvm-13 と同じ条件) #####'
          if g++ -c seek.cpp -o seek.o 2>seek.err; then
            echo "RESULT ${{ matrix.name }}: compile 通った (::lseek64 宣言あり)"
          else
            echo "RESULT ${{ matrix.name }}: compile 落ちた"
            grep -i "lseek64" seek.err | head -3
          fi
          echo '##### 2. _GNU_SOURCE を足すと通るか (直しの方向) #####'
          if g++ -D_GNU_SOURCE -c seek.cpp -o seek.o 2>/dev/null; then
            echo "  _GNU_SOURCE 付き: 通る"
          else
            echo "  _GNU_SOURCE 付き: それでも落ちる"
          fi
          echo '##### 3. _LARGEFILE64_SOURCE では #####'
          g++ -D_LARGEFILE64_SOURCE -c seek.cpp -o seek.o 2>/dev/null && echo "  _LARGEFILE64_SOURCE 付き: 通る" || echo "  _LARGEFILE64_SOURCE 付き: 落ちる"

  # ------------------------------------------------------------------
  # #178  lang/gnucobol の CBL_OC_DUMP が macOS で .dylib になり PLIST と食い違う
  # ------------------------------------------------------------------
  #
  # PLIST は lib/gnucobol/CBL_OC_DUMP.so を期待するが、macOS では libtool が
  # このローダブルモジュールを .dylib で作るため、pkg_create が
  #
  #   Files in the PLIST but not in .../CBL_OC_DUMP.so
  #   Files in ... but not in the PLIST: .../CBL_OC_DUMP.dylib
  #
  # で止まる。macOS でしか起きないので、GitHub の macOS runner で pkgsrc を
  # bootstrap して gnucobol を建て、症状を採る。
  fix178:
    if: inputs.target == 'all' || inputs.target == 'fix178'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: pkgsrc を bootstrap して gnucobol を建てる
        run: |
          set -x
          sw_vers; uname -m
          W="$RUNNER_TEMP/pkgsrc-work"; mkdir -p "$W"; cd "$W"
          echo '##### pkgsrc を取る #####'
          curl -fsSL -o pkgsrc.tar.gz https://cdn.NetBSD.org/pub/pkgsrc/current/pkgsrc.tar.gz
          tar xzf pkgsrc.tar.gz

          echo '##### 非特権 bootstrap #####'
          cd pkgsrc/bootstrap
          ./bootstrap --unprivileged --prefix "$W/pkg" --workdir "$W/bs" >"$W/bootstrap.log" 2>&1 || {
            echo '!! bootstrap 失敗'; tail -30 "$W/bootstrap.log"; exit 1; }
          BM="$W/pkg/bin/bmake"
          "$BM" --version >/dev/null 2>&1 || { echo '!! bmake 無し'; exit 1; }
          echo "bmake ok"

          echo '##### gnucobol を package まで建てる #####'
          cd "$W/pkgsrc/lang/gnucobol"
          # PLIST チェックで止まる想定。ログを採る。
          if "$BM" package >"$W/gnucobol.log" 2>&1; then
            echo 'RESULT #178: gnucobol は通ってしまった (症状再現せず)'
          else
            echo 'RESULT #178: gnucobol が止まった'
          fi

          echo '##### CBL_OC_DUMP が .so か .dylib か #####'
          find "$W/pkgsrc/lang/gnucobol/work" -name 'CBL_OC_DUMP.*' 2>/dev/null
          echo '##### PLIST の食い違い (#178 の症状) #####'
          grep -nE "CBL_OC_DUMP|Files in the PLIST but not|but not in the PLIST|\.dylib|\.so" "$W/gnucobol.log" | tail -25
          echo '##### PLIST が何を期待しているか #####'
          grep -n "CBL_OC_DUMP" "$W/pkgsrc/lang/gnucobol/PLIST"

          echo '##### 直しを当てて再 package (検証) #####'
          # 直しの中身: PLIST の拡張子を COB_MODULE_EXT に合わせる。macOS では
          # COB_MODULE_EXT=dylib なので、Darwin の場合の出力である .dylib を
          # PLIST に入れて package が通るかを見る (PLIST_SUBST の Darwin 分岐と
          # 同じ結果)。
          cd "$W/pkgsrc/lang/gnucobol"
          sed -i.bak 's|lib/gnucobol/CBL_OC_DUMP\.so|lib/gnucobol/CBL_OC_DUMP.dylib|' PLIST
          grep -n "CBL_OC_DUMP" PLIST
          # 最初の失敗で生成された packlist を消して作り直させる。これをしないと
          # 編集した PLIST が package に伝わらない。
          "$BM" clean-package >/dev/null 2>&1 || true
          find work -name '.PLIST*' -delete 2>/dev/null || true
          if "$BM" package >"$W/gnucobol-fixed.log" 2>&1; then
            echo 'RESULT #178 fix: package 成功 = 直った'
            find "$W" -name 'gnucobol-*.tgz' 2>/dev/null | head
          else
            echo 'RESULT #178 fix: まだ止まる'
            grep -nE "CBL_OC_DUMP|Files in the PLIST|but not in" "$W/gnucobol-fixed.log" | tail -15
          fi
