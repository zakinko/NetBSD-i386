name: xemacs

# XEmacs へ出す予定の直しを、手元の一台きりでなく公開の run で確かめる。
#
# 手元で測ったものは bambi (NetBSD 10.1/i386) 一台しかない。上流へ出すとき
# 「こちらでは落ちます」だけでは弱いので、誰でも開ける run の URL を添える。
#
#   overread   look_for_coding_cookie_last_page() が buffer を越えて読む件。
#              関数の写しは持たず、checkout から抜き出して組む。素の木で
#              落ち、当て物を入れると落ちないことを一つの job で両方見る。
#
#   windows    Windows のモジュール(動的ロード)対応。win-module-exports.patch
#              を当てて MSVC で建て、modules/sample/external を ellcc で
#              建てて load-module で読むところまで。
#
#   modules-linux  同じ当て物を Linux の 21.5 に当て、同じ手順でサンプルを
#              建てて読む。当て物は全 platform 共通の lisp/ellcc.el と
#              src/config.h.in にも触るので、Unix 側が壊れていないことを
#              別の箱で確かめる。windows を回すときは必ず一緒に回る。
#
#   check      win-module-exports.patch の前後で make check を比べる。
#              Linux と Windows のそれぞれで素の木と当てた木を建て、
#              test-harness の要約をファイルごとに突き合わせる。元から
#              落ちている test は当て物のせいではないので、減ったかだけを
#              見る。
#
# どちらも押すまで動かない。overread は数十秒、windows は数分。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'どれを回すか'
        type: choice
        options: [both, overread, windows, alloca, check, recheck, gui]
        default: both

concurrency:
  # target を入れないと、別の job を回したつもりが前の run を打ち消す。
  group: xemacs-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The module jobs build upstream at this changeset, taken from Heptapod
  # by ci/xemacs/fetch-upstream.sh (2026-09-24, after 21.5.37).
  XEMACS_UPSTREAM: eb16e65de2c72b97c6262ff0eceb910a8bd80734

jobs:
  overread:
    if: ${{ inputs.target == 'both' || inputs.target == 'overread' }}
    name: coding cookie の読み越し
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: XEmacs を取る
        run: |
          git clone --quiet --depth 1 https://github.com/zakinko/XEmacs xemacs
          # file-coding.c は上流 tip と同一 (fork は elhash の一件だけ先行)
          echo "HEAD: $(cd xemacs && git log --oneline -1)"

      - name: 素の木で越えることを見る
        run: ci/xemacs/overread.sh "$PWD/xemacs"

      - name: 当て物を入れると越えないことを見る
        run: |
          git clone --quiet --depth 1 https://github.com/zakinko/XEmacs xemacs2
          ci/xemacs/overread.sh "$PWD/xemacs2" \
              "$PWD/ci/xemacs/file-coding-lastpage-overread.patch"

  alloca:
    if: ${{ inputs.target == 'both' || inputs.target == 'alloca' }}
    name: alloca の五箇所 (Linux で二つ目の箱)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 依存
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libncurses-dev texinfo

      - name: XEmacs 21.4 を取る
        run: |
          git clone --quiet https://github.com/zakinko/XEmacs-21.4 x214base
          cp -a x214base x214patched

      - name: 素の木で五つとも落ちるか
        run: ci/xemacs/alloca.sh "$PWD/x214base" base

      - name: 当て物を入れると落ちないか
        run: ci/xemacs/alloca.sh "$PWD/x214patched" patched

  modules-linux:
    if: ${{ inputs.target == 'both' || inputs.target == 'windows' }}
    name: 同じ当て物で Linux のモジュールが建って読めるか
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 依存
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libncurses-dev texinfo

      - name: XEmacs を取る
        shell: bash
        run: ci/xemacs/fetch-upstream.sh xemacs

      - name: 建てて、サンプルを ellcc で建てて読む
        run: ci/xemacs/linux-module-sample.sh "$PWD/xemacs"

  windows:
    if: ${{ inputs.target == 'both' || inputs.target == 'windows' }}
    name: Windows で建つか (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: XEmacs を取る
        shell: bash
        run: ci/xemacs/fetch-upstream.sh xemacs

      - name: 後で走らせる PowerShell を先に構文だけ通す
        shell: pwsh
        run: |
          # "$label:" を scope 付き変数と読まれて、build を終えた後で
          # 一行も出さずに落ちたことがある。数分待たずにここで止める。
          # 検査そのものが鳴るかを、実際に落ちた形で先に確かめる。
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput(
            'throw "$label: x"', [ref]$null, [ref]$errs)
          if (-not $errs) { throw "構文検査が壊れた形を通した" }
          "self-test: 壊れた形は弾かれる"
          $bad = 0
          foreach ($f in Get-ChildItem ci/xemacs/*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { "$($f.Name): $_" }; $bad++ }
            else { "$($f.Name): ok" }
          }
          if ($bad) { throw "構文エラーのある script: $bad" }

      - name: モジュール API を書き出す当て物を当てる
        shell: bash
        run: |
          cd xemacs
          patch -p1 -f -i "$GITHUB_WORKSPACE/ci/xemacs/win-module-exports.patch" </dev/null
          # 当たったことを、当て物が入れた語そのもので確かめる。
          grep -q -- '-implib:' nt/xemacs.mak
          grep -q 'XEMACS_DEF' nt/xemacs.mak
          grep -q 'USE_CPLUSPLUS' nt/xemacs.mak src/config.h.in
          grep -q 'echo dll_ld>>' nt/xemacs.mak
          grep -q 'emodule_noop_' lisp/ellcc.el

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: config.inc を最小構成で置く
        shell: pwsh
        run: ci/xemacs/win-config-inc.ps1 "$PWD/xemacs"

      - name: nmake で建てる (info 段は makeinfo が無いので落ちる。既知)
        shell: cmd
        continue-on-error: true
        env:
          # xemacs.mak names the configuration from PROCESSOR_ARCHITECTURE,
          # the host's; building x86 on an x64 runner it would say x86_64.
          PROCESSOR_ARCHITECTURE: ${{ matrix.arch == 'x86' && 'x86' || 'AMD64' }}
        run: |
          cd xemacs\nt
          nmake -f xemacs.mak

      - name: xemacs.exe が出来たかを明示的に判定する
        shell: pwsh
        run: |
          # info ドキュメント段は makeinfo が無くて落ちるが、本体はその前に
          # 出来ている。ここで無ければ本当の失敗なので job を落とす。
          # link は落ちても出力 file を作ることがある。一度 0 バイトの
          # xemacs.exe を「出来た」と読んだので、在るかではなく大きさで見る。
          $exe = "xemacs/src/xemacs.exe"
          if (-not (Test-Path $exe)) { throw "xemacs.exe が無い" }
          Get-Item xemacs/src/temacs.exe, $exe | Format-Table Name, Length
          $len = (Get-Item $exe).Length
          if ($len -lt 1000000) { throw "xemacs.exe が $len バイトしかない" }

      - name: xemacs.def と import library が出来たか
        shell: pwsh
        run: |
          # ここが当て物の要。configure を通らない build でも
          # モジュール API が書き出せているかを、生成物で見る。
          $def = "xemacs/src/xemacs.def"
          if (-not (Test-Path $def)) { throw "xemacs.def が無い" }
          Write-Host "--- xemacs.def の頭 ---"
          Get-Content $def -TotalCount 12
          $n = (Select-String -Path $def -Pattern '^[A-Za-z_][A-Za-z0-9_]*$').Count
          Write-Host "def に並んだ symbol: $n"
          if ($n -lt 100) { throw "symbol が少なすぎる ($n)。cpp が通っていない" }
          # cl はファイル名を stderr に出す (以前の log で画面に出ていた)。
          # stdout に来ていれば export の名前として def に紛れ込む。
          if (Select-String -Path $def -Pattern '^xemacs_def\.c$' -Quiet) {
            throw "xemacs.def に cl のファイル名の行が紛れ込んでいる"
          }

          $lib = "xemacs/src/xemacs.lib"
          if (-not (Test-Path $lib)) { throw "import library xemacs.lib が無い" }
          Get-Item $lib | Format-Table Name, Length

          # exe 側にも本当に export されているかを dumpbin で数える。
          $out = & dumpbin /exports xemacs/src/xemacs.exe
          $e = ($out | Select-String -Pattern '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+\S').Count
          Write-Host "xemacs.exe の export: $e"
          if ($e -lt 100) { throw "exe に export が乗っていない ($e)" }

      - name: モジュールの feature が見えるか
        shell: pwsh
        run: |
          # xemacs.exe は -subsystem:windows で建つので、console から
          # 直に起動すると出力が返らず固まる。lib-src/i.c がそのための
          # 連結役で、build 中の dump もこれ経由で走っている。
          # 一時間の timeout を一度これで潰したので、上限も付ける。
          # $args は PowerShell の自動変数なので使わない。
          $a = @("src\xemacs.exe","-batch","-vanilla","-load",
                 "$env:GITHUB_WORKSPACE\ci\xemacs\win-modules-probe.el")
          # -FilePath は呼び出し側の cwd で解決されるので絶対 path で渡す。
          $i = Join-Path $PWD "xemacs\lib-src\i.exe"
          if (-not (Test-Path $i)) { throw "i.exe が無い" }
          $p = Start-Process -FilePath $i -ArgumentList $a `
                 -WorkingDirectory "$PWD\xemacs" -NoNewWindow -PassThru `
                 -RedirectStandardOutput probe.out -RedirectStandardError probe.err
          if (-not $p.WaitForExit(180000)) {
            $p.Kill(); Get-Content probe.out, probe.err -EA SilentlyContinue
            throw "probe が 180 秒で返らなかった"
          }
          Get-Content probe.out, probe.err -EA SilentlyContinue
          Write-Host "exit: $($p.ExitCode)"

      - name: ellcc が config.values を読めるか
        shell: pwsh
        run: |
          # ellcc は module の compiler/linker 駆動で、道具も flag も全て
          # config.values から引く。nt/xemacs.mak が書いていた 8 個には
          # 一つも含まれていなかったので、config-value は nil を返し、
          # ellcc は起動すらできなかった。足した値が届いているかを見る。
          # ここで測れるのは「ellcc が走って値を見ている」ことまで。
          # .ell が建つかは別に測る。
          $i = Join-Path $PWD "xemacs\lib-src\i.exe"
          $el = Join-Path $PWD "xemacs\lisp\ellcc.el"
          $a = @("src\xemacs.exe","-batch","--script",$el,"--",
                 "--mode=verbose","--mode=verbose","--mod-name=sample",
                 "--mod-version=0.0.1","--mod-title=probe")
          $p = Start-Process -FilePath $i -ArgumentList $a `
                 -WorkingDirectory "$PWD\xemacs" -NoNewWindow -PassThru `
                 -RedirectStandardOutput ellcc.out -RedirectStandardError ellcc.err
          if (-not $p.WaitForExit(180000)) {
            $p.Kill(); Get-Content ellcc.out, ellcc.err -EA SilentlyContinue
            throw "ellcc が 180 秒で返らなかった"
          }
          Write-Host "--- config.values ---"
          Get-Content xemacs/lib-src/config.values
          Write-Host "--- ellcc --mode=verbose ---"
          Get-Content ellcc.out, ellcc.err -EA SilentlyContinue
          Write-Host "exit: $($p.ExitCode)"
          # 足した値を一つずつ名指しで確かめる。ここで "= nil" を一律に
          # 弾くと ARCHLIBDIR で落ちる — あれはまだ足していないので
          # "Include directory = nil/include" と出るのが正しい姿。
          $o = (Get-Content ellcc.out -Raw -EA SilentlyContinue)
          foreach ($pat in 'LD = link\.exe',
                           'LDFLAGS = -nologo -dll',
                           'architecture = \S+-pc-win32',
                           'CC = \S') {
            if ($o -notmatch $pat) { throw "config.values が届いていない: $pat" }
          }
          Write-Host "ARCHLIBDIR はまだ足していないので Include directory は nil のまま"

      - name: サンプルのモジュールを ellcc で建てて読む
        shell: pwsh
        run: ci/xemacs/win-module-sample.ps1

      - name: 動的ロードの足回りが object に入っているか
        shell: cmd
        run: |
          rem Windows は config.h.in をそのまま config.h にして使い、その中で
          rem s/windowsnt.h を読む。そこで HAVE_SHLIB は既に定義されている。
          cd xemacs
          findstr /C:"define HAVE_SHLIB" src\s\windowsnt.h
          dir nt\obj\emodules.obj nt\obj\sysdll.obj

  linux-check:
    if: ${{ inputs.target == 'check' }}
    name: make check (Linux, ${{ matrix.tree }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tree: [base, patched]
    steps:
      - uses: actions/checkout@v4

      - name: 依存
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libncurses-dev texinfo

      - name: XEmacs を取る
        shell: bash
        run: ci/xemacs/fetch-upstream.sh xemacs

      - name: 建てて make check
        run: ci/xemacs/linux-check.sh "$PWD/xemacs" ${{ matrix.tree }} "$PWD/check.log"

      - uses: actions/upload-artifact@v4
        with:
          name: check-linux-${{ matrix.tree }}
          path: check.log

  windows-check:
    if: ${{ inputs.target == 'check' }}
    name: make check (Windows ${{ matrix.arch }}, ${{ matrix.tree }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tree: [base, patched]
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: XEmacs を取る
        shell: bash
        run: ci/xemacs/fetch-upstream.sh xemacs

      - name: 当て物を当てる (patched のときだけ)
        if: ${{ matrix.tree == 'patched' }}
        shell: bash
        run: |
          cd xemacs
          patch -p1 -f -i "$GITHUB_WORKSPACE/ci/xemacs/win-module-exports.patch" </dev/null
          grep -q 'emodule_noop_' lisp/ellcc.el
          grep -q 'USE_CPLUSPLUS' nt/xemacs.mak src/config.h.in

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: config.inc を最小構成で置く
        shell: pwsh
        run: ci/xemacs/win-config-inc.ps1 "$PWD/xemacs"

      - name: nmake で建てる (info 段は makeinfo が無いので落ちる。既知)
        shell: cmd
        continue-on-error: true
        env:
          # xemacs.mak names the configuration from PROCESSOR_ARCHITECTURE,
          # the host's; building x86 on an x64 runner it would say x86_64.
          PROCESSOR_ARCHITECTURE: ${{ matrix.arch == 'x86' && 'x86' || 'AMD64' }}
        run: |
          cd xemacs\nt
          nmake -f xemacs.mak

      - name: xemacs.exe が出来たか
        shell: pwsh
        run: |
          $len = (Get-Item xemacs/src/xemacs.exe).Length
          Write-Host "xemacs.exe: $len bytes"
          if ($len -lt 1000000) { throw "xemacs.exe が $len バイトしかない" }

      - name: make check
        shell: cmd
        timeout-minutes: 45
        continue-on-error: true
        run: |
          cd xemacs\nt
          nmake -f xemacs.mak check > "%GITHUB_WORKSPACE%\check.log" 2>&1
          echo nmake check exited %ERRORLEVEL%

      - name: 要約を出す
        shell: bash
        run: grep -E 'tests successful|No tests run|\(aborted\)' check.log | tr -d '\r' | tail -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: check-windows-${{ matrix.arch }}-${{ matrix.tree }}
          path: check.log

  check-compare:
    if: ${{ always() && inputs.target == 'check' }}
    needs: [linux-check, windows-check]
    name: make check を前後で突き合わせる
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: check-*

      - name: 突き合わせる
        run: |
          rc=0
          for os in linux windows-x64 windows-x86; do
            echo "=================== $os ==================="
            if [ ! -f check-$os-base/check.log ] || [ ! -f check-$os-patched/check.log ]; then
              echo "!! $os: log が揃っていない (測れていない)"; rc=1; continue
            fi
            python3 ci/xemacs/check-compare.py \
              check-$os-base/check.log check-$os-patched/check.log || rc=1
          done
          exit $rc

  windows-recheck:
    if: ${{ inputs.target == 'recheck' }}
    name: Windows の差が木に付くか箱に付くか (同じ job で交互に)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 後で走らせる PowerShell を先に構文だけ通す
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem ci/xemacs/*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { "$($f.Name): $_" }; $bad++ }
            else { "$($f.Name): ok" }
          }
          if ($bad) { throw "構文エラーのある script: $bad" }

      - name: XEmacs を二つ取り、片方にだけ当てる
        shell: bash
        run: |
          ci/xemacs/fetch-upstream.sh xb
          cp -a xb xp
          cd xp
          patch -p1 -f -i "$GITHUB_WORKSPACE/ci/xemacs/win-module-exports.patch" </dev/null
          grep -q 'emodule_noop_' lisp/ellcc.el
          cd ../xb && ! grep -q 'emodule_noop_' lisp/ellcc.el

      - uses: ilammy/msvc-dev-cmd@v1

      - name: config.inc を両方に置く
        shell: pwsh
        run: |
          ci/xemacs/win-config-inc.ps1 "$PWD/xb"
          ci/xemacs/win-config-inc.ps1 "$PWD/xp"

      - name: 素の木を建てる
        shell: cmd
        continue-on-error: true
        run: |
          cd xb\nt
          nmake -f xemacs.mak

      - name: 当てた木を建てる
        shell: cmd
        continue-on-error: true
        run: |
          cd xp\nt
          nmake -f xemacs.mak

      - name: 両方の xemacs.exe が出来たか
        shell: pwsh
        run: |
          foreach ($t in 'xb','xp') {
            $len = (Get-Item "$t/src/xemacs.exe").Length
            Write-Host "$t/src/xemacs.exe: $len bytes"
            if ($len -lt 1000000) { throw "$t の xemacs.exe が $len バイトしかない" }
          }

      - name: 二つの test を交互に三回ずつ
        shell: pwsh
        run: ci/xemacs/win-recheck.ps1 "$PWD\xb" "$PWD\xp"

  windows-gui:
    if: ${{ inputs.target == 'gui' }}
    name: Windows の GUI で起動・入力・モジュール (${{ matrix.arch }}, 素の木と当てた木)
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: 後で走らせる PowerShell を先に構文だけ通す
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem ci/xemacs/*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { "$($f.Name): $_" }; $bad++ }
            else { "$($f.Name): ok" }
          }
          if ($bad) { throw "構文エラーのある script: $bad" }

      - name: XEmacs を二つ取り、xemacs にだけ当てる
        shell: bash
        run: |
          ci/xemacs/fetch-upstream.sh xb
          cp -a xb xemacs
          cd xemacs
          patch -p1 -f -i "$GITHUB_WORKSPACE/ci/xemacs/win-module-exports.patch" </dev/null
          grep -q 'emodule_noop_' lisp/ellcc.el

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: config.inc を両方に置く
        shell: pwsh
        run: |
          ci/xemacs/win-config-inc.ps1 "$PWD/xb"
          ci/xemacs/win-config-inc.ps1 "$PWD/xemacs"

      - name: 素の木を建てる
        shell: cmd
        continue-on-error: true
        env:
          PROCESSOR_ARCHITECTURE: ${{ matrix.arch == 'x86' && 'x86' || 'AMD64' }}
        run: |
          cd xb\nt
          nmake -f xemacs.mak

      - name: 当てた木を建てる
        shell: cmd
        continue-on-error: true
        env:
          PROCESSOR_ARCHITECTURE: ${{ matrix.arch == 'x86' && 'x86' || 'AMD64' }}
        run: |
          cd xemacs\nt
          nmake -f xemacs.mak

      - name: 両方の xemacs.exe が出来たか
        shell: pwsh
        run: |
          foreach ($t in 'xb','xemacs') {
            $len = (Get-Item "$t/src/xemacs.exe").Length
            Write-Host "$t/src/xemacs.exe: $len bytes"
            if ($len -lt 1000000) { throw "$t の xemacs.exe が $len バイトしかない" }
          }

      - name: 当てた木でサンプルのモジュールを建てる
        shell: pwsh
        run: ci/xemacs/win-module-sample.ps1

      - name: 素の木を GUI で
        shell: pwsh
        run: ci/xemacs/win-gui.ps1 "$PWD\xb" base

      - name: 当てた木を GUI で (モジュールも GUI の中で読む)
        shell: pwsh
        run: ci/xemacs/win-gui.ps1 "$PWD\xemacs" patched "$PWD\xemacs\modules\sample\external\sample.ell"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gui-screenshots-${{ matrix.arch }}
          path: gui-out
