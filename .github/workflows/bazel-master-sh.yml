# master の bash→sh の枝 (posix-sh-v2) を、CI で届く OS 全部で踏む。
#
# dist archive は OS に依らないので Linux で一度だけ作って artifact に上げ、
# 各 OS はそれを落として自分の /bin/sh だけで bootstrap し、出来た bazel で
# 煙試験まで通す。/bin/sh の実装が OS ごとに違うのが狙い:
#
#   Ubuntu    dash
#   Alpine    busybox ash (musl。unix_jni.h の stat64 の当て物が要る)
#   macOS     bash の posix mode (既定 shell は zsh)
#   FreeBSD   ash 系
#   GhostBSD  同上
#   OpenBSD   pdksh 系
#
# NetBSD と DragonFly は master が host として未対応 (#31069 待ち) で JDK 25 も
# package に無いので、ここには入れない。
#
# master の bazel は rules_python 1.7.0 の interpreter script を visibility で
# 弾く (bash で bootstrap しても同じ。run 35585160268 の control-bash)。
# sh 化とは無関係なので --check_visibility=false で越える。
name: bazel-master-sh

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'zakinko/bazel の枝'
        type: string
        default: 'posix-sh-v2'
      bsd:
        description: 'BSD (FreeBSD / OpenBSD / GhostBSD) も回す (VM で時間がかかる)'
        type: boolean
        default: true
      wide:
        description: 'さらに広く: Fedora / Arch / openSUSE / Windows / HardenedBSD / MidnightBSD'
        type: boolean
        default: false
      jdk21:
        description: 'master を JDK 21 (JAVA_VERSION=21) で建てられるかを Ubuntu で測るだけ'
        type: boolean
        default: false
      i386:
        description: '32bit x86 (Debian i386 の container) でも建てる。JDK 25 は JEP 503 で 32bit x86 の port ごと消えているので distro の openjdk-21'
        type: boolean
        default: false
      netbsd:
        description: 'NetBSD と DragonFly も回す (bazel #31069 と module の当て物を差す)'
        type: boolean
        default: false
      jdk_kit:
        description: 'NetBSD と DragonFly では jdk25u の bootstrap kit (JDK 25) を使う。false なら package の openjdk21 と JAVA_VERSION=21'
        type: boolean
        default: false
      rp_bump:
        description: 'rules_python を当て物ではなくこの版へ上げて建てる (例 2.3.3)。空なら export の当て物'
        type: string
        default: ''
      no_musl_patch:
        description: 'musl の箱で unix_jni.h の当て物を当てない。上流へ出す本文が引用している error を実際に出すため'
        type: boolean
        default: false
      only:
        description: 'この job だけ回す (job 名を , 区切り。例 midnightbsd,rocky-bash)。空なら他の入力どおり。CI が混むので、通った箱を撃ち直さないため'
        type: string
        default: ''

concurrency:
  group: bazel-master-sh-${{ github.ref }}-${{ inputs.branch }}-${{ inputs.bsd }}-${{ inputs.wide }}-${{ inputs.jdk21 }}-${{ inputs.netbsd }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  dist:
    # 一時期 QNAP の中の VM を self-hosted runner にしてここへ充てていた。
    # GitHub の runner は account 全体で取り合いになり、cache に当たれば
    # 数十秒で終わるこの job が行列で一時間以上待つことがあったため。
    #
    # 2026-09-24 に戻した。cache に当たる回は 35 秒から 4 分で、どちらの
    # runner でも変わらない。違うのは外れた回で、Celeron J3455 では dist を
    # 素から作りきれず 4 時間の timeout に当たって切られた (run 35963876082,
    # 35965182472, 35984845218 の三回とも)。待ちは最大一時間、外れた回は必ず
    # 四時間潰れて何も出ない、という比較なので割に合わない。
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # 枝の先端が同じなら dist は同じ物になる。run のたびに 20〜30 分かけて
      # 作り直すと、落ちた箱を一つ撃ち直すだけでも runner を一つ余計に長く
      # 掴む。SHA を鍵にして取っておく
      - name: 枝の先端を引く
        id: head
        run: |
          sha=$(git ls-remote https://github.com/zakinko/bazel.git \
                "refs/heads/${{ inputs.branch }}" | cut -f1)
          [ -n "$sha" ] || { echo "枝 ${{ inputs.branch }} が見つからない"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "${{ inputs.branch }} = $sha"
      - uses: actions/cache@v4
        id: dist-cache
        with:
          path: bazel-distfile.zip
          key: dist-${{ steps.head.outputs.sha }}-${{ hashFiles('ci/bazel-bootstrap/make-master-dist.sh') }}
      - uses: actions/setup-java@v4
        if: steps.dist-cache.outputs.cache-hit != 'true'
        with: { distribution: temurin, java-version: '25' }
      - name: make the dist archive from the branch
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          sh ci/bazel-bootstrap/make-master-dist.sh "$GITHUB_WORKSPACE/bazel-distfile.zip"
        env:
          BRANCH: ${{ inputs.branch }}
      - name: cache から出したものを確かめる
        run: |
          ls -l bazel-distfile.zip
          unzip -l bazel-distfile.zip | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: master-sh-dist
          path: bazel-distfile.zip
          retention-days: 3

  linux:
    needs: dist
    # only= に linux の箱が一つも無ければ job ごと飛ばす (matrix の中の gate は
    # runner を取ってから判定するので、それだけだと枠を食う)
    if: ${{ !inputs.jdk21 && (inputs.only == '' || contains(inputs.only, '-dash') || contains(inputs.only, '-bash') || contains(inputs.only, '-ash') || contains(inputs.only, '-musl') || contains(inputs.only, 'ubuntu-arm64')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 素の六箱 (bsd=false wide=false でも回る)
          - { name: ubuntu-dash,   os: ubuntu-latest,    container: '' }
          - { name: alpine-ash,    os: ubuntu-latest,    container: 'alpine:latest' }
          # wide: /bin/sh が bash の glibc、dash の Debian、musl の別の二つ、aarch64
          - { name: debian-dash,   os: ubuntu-latest,    container: 'debian:stable',              wide: true }
          - { name: fedora-bash,   os: ubuntu-latest,    container: 'fedora:latest',              wide: true }
          - { name: arch-bash,     os: ubuntu-latest,    container: 'archlinux:latest',           wide: true }
          - { name: gentoo-bash,   os: ubuntu-latest,    container: 'gentoo/stage3:latest',       wide: true }
          - { name: ubuntu-arm64,  os: ubuntu-24.04-arm, container: '',                           wide: true }
    name: linux (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), format(',{0},', matrix.name))) || (inputs.only == '' && (!matrix.wide || inputs.wide)) }}
      - name: distro の道具 (musl の箱は distro の JDK も)
        if: ${{ matrix.container != '' && ((inputs.only != '' && contains(format(',{0},', inputs.only), format(',{0},', matrix.name))) || (inputs.only == '' && (!matrix.wide || inputs.wide))) }}
        run: sh ci/bazel-bootstrap/linux-tools.sh
      - uses: actions/setup-java@v4
        if: ${{ ((inputs.only != '' && contains(format(',{0},', inputs.only), format(',{0},', matrix.name))) || (inputs.only == '' && (!matrix.wide || inputs.wide))) && !contains(matrix.name, 'musl') && matrix.container != 'alpine:latest' }}
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), format(',{0},', matrix.name))) || (inputs.only == '' && (!matrix.wide || inputs.wide)) }}
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: bootstrap the dist under /bin/sh (${{ matrix.name }})
        if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), format(',{0},', matrix.name))) || (inputs.only == '' && (!matrix.wide || inputs.wide)) }}
        run: |
          set -x
          echo "/bin/sh -> $(readlink -f /bin/sh)  JAVA_HOME=$JAVA_HOME  JAVA_VERSION=${JAVA_VERSION:-}"
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /bin/sh
          LOG_BASH: '1'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}
          NO_MUSL_PATCH: ${{ inputs.no_musl_patch && '1' || '0' }}

  # runner の container: が起こせない箱。Void と Chimera は runner の glibc 向け
  # node が musl で exec に落ち、leap は像に sh が無くて runner の sh -c で落ちる。
  # docker run で素の image を起こし、中で linux-in-docker.sh に回させる。
  linux-docker:
    needs: dist
    # only= のときは、そこに docker の箱が名指しされているときだけ起こす。
    # only != '' だけで通すと、BSD 一つを撃つたびにこの三つも runner を取る
    if: ${{ !inputs.jdk21 && (inputs.only == '' && inputs.wide || contains(inputs.only, 'leap-bash') || contains(inputs.only, 'rocky-bash') || contains(inputs.only, 'void-musl') || contains(inputs.only, 'chimera-musl')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: leap-bash,    image: 'opensuse/leap:latest',            shell: /bin/bash }
          - { name: rocky-bash,   image: 'rockylinux/rockylinux:9',         shell: /bin/bash }
          - { name: void-musl,    image: 'voidlinux/voidlinux-musl:latest', shell: /bin/sh }
          - { name: chimera-musl, image: 'chimeralinux/chimera:latest',     shell: /bin/sh }
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0},', matrix.name)) }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0},', matrix.name)) }}
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: bootstrap the dist under /bin/sh in docker (${{ matrix.name }})
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0},', matrix.name)) }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w \
            -e SH_BIN=/bin/sh -e LOG_BASH=1 -e NO_VIS=0 -e "RP_BUMP=${{ inputs.rp_bump }}" \
            -e "IN_SHELL=${{ matrix.shell }}" \
            "${{ matrix.image }}" "${{ matrix.shell }}" \
            ci/bazel-bootstrap/linux-in-docker.sh /w /w/master-sh-dist/bazel-distfile.zip

  macos:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',macos,')) || (inputs.only == '' && (!inputs.jdk21)) }}
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: bootstrap the dist under /bin/sh (macOS)
        run: |
          set -x
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}
          NO_MUSL_PATCH: ${{ inputs.no_musl_patch && '1' || '0' }}

  freebsd:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',freebsd,')) || (inputs.only == '' && (inputs.bsd && !inputs.jdk21)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/freebsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  openbsd:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',openbsd,')) || (inputs.only == '' && (inputs.bsd && !inputs.jdk21)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/openbsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  ghostbsd:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',ghostbsd,')) || (inputs.only == '' && (inputs.bsd && !inputs.jdk21)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/ghostbsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  windows:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',windows,')) || (inputs.only == '' && (inputs.wide && !inputs.jdk21)) }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: install zip and unzip
        shell: pwsh
        run: choco install zip unzip -y --no-progress
      - name: bootstrap the dist under MSYS sh (Windows)
        shell: bash
        run: |
          set -x
          export BAZEL_VC="${VCINSTALLDIR%\\}"
          export BAZEL_SH="$(cygpath -w "$(which bash)")"
          echo "sh -> $(which sh)  ($(sh -c 'echo $BASH_VERSION'))"
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /usr/bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}
          NO_MUSL_PATCH: ${{ inputs.no_musl_patch && '1' || '0' }}

  hardenedbsd:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',hardenedbsd,')) || (inputs.only == '' && (inputs.wide && !inputs.jdk21)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/hardenedbsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  # MidnightBSD は FreeBSD 派生だが uname -s が違う。bazel がどこで止まるかを
  # 見るための箱。通ることは期待していない。
  midnightbsd:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',midnightbsd,')) || (inputs.only == '' && (inputs.wide && !inputs.jdk21)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/midnightbsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  # master は JAVA_VERSION の既定が 25 だが、Java の source が本当に 25 の言語
  # 機能を使っているかは別。JDK 21 と JAVA_VERSION=21 で建つなら、package の
  # JDK が 21 止まりの NetBSD と DragonFly でも kit 無しで建てられる。
  jdk21:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',jdk21,')) || (inputs.only == '' && (inputs.jdk21)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: bootstrap the dist with JDK 21
        run: |
          set -x
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}
          NO_MUSL_PATCH: ${{ inputs.no_musl_patch && '1' || '0' }}
          JAVA_VERSION: '21'

  # 32bit x86。CPU は amd64 の runner がそのまま 32bit code を走らせるので
  # emulation ではない (--platform linux/386 で像だけ 32bit にする)。
  #
  # ここで測りたいのは一つ: bazel が i386 で動くのか。bazel の木に i386 を
  # 拒む code は無く (util/CPU.java:24 が i386 を X86_32 として持っている)、
  # 壁は JDK の側にある。JEP 503 が JDK 25 で 32bit x86 の port を削除したので
  # 25 は存在せず、Debian が i386 向けに建てている openjdk-21 で
  # JAVA_VERSION=21 として建てる。
  i386:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',i386,')) || (inputs.only == '' && inputs.i386) }}
    runs-on: ubuntu-latest
    # 32bit の JVM は遅い。GitHub の job の上限 (6 時間) まで取る
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      # 素の像には file(1) が無い。確認の step が本体を落とさないよう、
      # 像が持っている物だけで見て、失敗しても次へ進める
      - name: 像が本当に 32bit か
        continue-on-error: true
        run: |
          docker run --rm --platform linux/386 i386/debian:stable \
            sh -c 'uname -m; dpkg --print-architecture; head -c 20 /bin/dash | od -c | head -2'
      - name: bootstrap the dist on i386 (JDK 21)
        run: |
          docker run --rm --platform linux/386 -v "$GITHUB_WORKSPACE:/w" -w /w \
            -e SH_BIN=/bin/sh -e LOG_BASH=1 -e NO_VIS=0 -e "RP_BUMP=${{ inputs.rp_bump }}" \
            -e IN_SHELL=/bin/sh -e I386=1 -e JDK_WANT=21 \
            i386/debian:stable /bin/sh \
            ci/bazel-bootstrap/linux-in-docker.sh /w /w/master-sh-dist/bazel-distfile.zip

  netbsd:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',netbsd,')) || (inputs.only == '' && (inputs.netbsd && !inputs.jdk21)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE JDK_KIT'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
    env:
      JDK_KIT: ${{ inputs.jdk_kit && '1' || '0' }}

  dragonfly:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',dragonfly,')) || (inputs.only == '' && (inputs.netbsd && !inputs.jdk21)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE JDK_KIT'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
    env:
      JDK_KIT: ${{ inputs.jdk_kit && '1' || '0' }}

  macos-intel:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',macos-intel,')) || (inputs.only == '' && (inputs.wide && !inputs.jdk21)) }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: bootstrap the dist under /bin/sh (macOS Intel)
        run: |
          set -x
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}
          NO_MUSL_PATCH: ${{ inputs.no_musl_patch && '1' || '0' }}

  windows-arm64:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',windows-arm64,')) || (inputs.only == '' && (inputs.wide && !inputs.jdk21)) }}
    runs-on: windows-11-arm
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        # temurin は Windows の aarch64 を配っていない (setup-java が
        # "Could not find satisfied version for SemVer '25'")。zulu は在る。
        with: { distribution: zulu, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: arm64 }
      - name: install zip and unzip
        shell: pwsh
        run: choco install zip unzip -y --no-progress
      - name: bootstrap the dist under MSYS sh (Windows arm64)
        shell: bash
        run: |
          set -x
          export BAZEL_VC="${VCINSTALLDIR%\\}"
          export BAZEL_SH="$(cygpath -w "$(which bash)")"
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /usr/bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}
          NO_MUSL_PATCH: ${{ inputs.no_musl_patch && '1' || '0' }}

  # aarch64 の BSD。像は在る (vmactions/freebsd-vm の conf に 15.1-aarch64、
  # openbsd-vm に 7.9-aarch64)。落ちていたのは host の方で、x86_64 の runner の
  # 上では guest が TCG になり、JVM が SIGSEGV で落ちるか時間切れになっていた。
  # ubuntu-24.04-arm なら host が aarch64 なので guest は KVM で走る。この repo は
  # public なので arm64 runner は無料枠、ubuntu-arm64 の箱で既に使っている。
  freebsd-arm64:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',freebsd-arm64,')) || (inputs.only == '' && (inputs.wide && inputs.bsd && !inputs.jdk21)) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: host が aarch64 で KVM を持っているかを先に言う
        run: |
          echo "host: $(uname -m)  runner: ${{ runner.arch }}"
          ls -l /dev/kvm 2>&1 || echo "/dev/kvm が無い。guest は TCG で走る"
          grep -c . /proc/cpuinfo >/dev/null && nproc
      - uses: vmactions/freebsd-vm@v1
        with:
          arch: aarch64
          release: "15.1"
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  openbsd-arm64:
    needs: dist
    if: ${{ (inputs.only != '' && contains(format(',{0},', inputs.only), ',openbsd-arm64,')) || (inputs.only == '' && (inputs.wide && inputs.bsd && !inputs.jdk21)) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: host が aarch64 で KVM を持っているかを先に言う
        run: |
          echo "host: $(uname -m)  runner: ${{ runner.arch }}"
          ls -l /dev/kvm 2>&1 || echo "/dev/kvm が無い。guest は TCG で走る"
          grep -c . /proc/cpuinfo >/dev/null && nproc
      - uses: vmactions/openbsd-vm@v1
        with:
          arch: aarch64
          release: "7.9"
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
