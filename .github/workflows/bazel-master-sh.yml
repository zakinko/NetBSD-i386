# master の bash→sh の枝 (posix-sh-v2) を、CI で届く OS 全部で踏む。
#
# dist archive は OS に依らないので Linux で一度だけ作って artifact に上げ、
# 各 OS はそれを落として自分の /bin/sh だけで bootstrap し、出来た bazel で
# 煙試験まで通す。/bin/sh の実装が OS ごとに違うのが狙い:
#
#   Ubuntu    dash
#   Alpine    busybox ash (musl。unix_jni.h の stat64 の当て物が要る)
#   macOS     bash の posix mode (既定 shell は zsh)
#   FreeBSD   ash 系
#   GhostBSD  同上
#   OpenBSD   pdksh 系
#
# NetBSD と DragonFly は master が host として未対応 (#31069 待ち) で JDK 25 も
# package に無いので、ここには入れない。
#
# master の bazel は rules_python 1.7.0 の interpreter script を visibility で
# 弾く (bash で bootstrap しても同じ。run 35585160268 の control-bash)。
# sh 化とは無関係なので --check_visibility=false で越える。
name: bazel-master-sh

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'zakinko/bazel の枝'
        type: string
        default: 'posix-sh-v2'
      bsd:
        description: 'BSD (FreeBSD / OpenBSD / GhostBSD) も回す (VM で時間がかかる)'
        type: boolean
        default: true
      wide:
        description: 'さらに広く: Fedora / Arch / openSUSE / Windows / HardenedBSD / MidnightBSD'
        type: boolean
        default: false
      jdk21:
        description: 'master を JDK 21 (JAVA_VERSION=21) で建てられるかを Ubuntu で測るだけ'
        type: boolean
        default: false
      netbsd:
        description: 'NetBSD と DragonFly も回す (bazel #31069 と module の当て物を差す)'
        type: boolean
        default: false
      jdk_kit:
        description: 'NetBSD では jdk25u の bootstrap kit (JDK 25) を使う。false なら pkgsrc の openjdk21 と JAVA_VERSION=21'
        type: boolean
        default: false
      rp_bump:
        description: 'rules_python を当て物ではなくこの版へ上げて建てる (例 2.3.3)。空なら export の当て物'
        type: string
        default: ''

concurrency:
  group: bazel-master-sh-${{ github.ref }}-${{ inputs.branch }}-${{ inputs.bsd }}-${{ inputs.wide }}-${{ inputs.jdk21 }}-${{ inputs.netbsd }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: make the dist archive from the branch
        run: |
          set -x
          sh ci/bazel-bootstrap/make-master-dist.sh "$GITHUB_WORKSPACE/bazel-distfile.zip"
        env:
          BRANCH: ${{ inputs.branch }}
      - uses: actions/upload-artifact@v4
        with:
          name: master-sh-dist
          path: bazel-distfile.zip
          retention-days: 3

  linux:
    needs: dist
    if: ${{ !inputs.jdk21 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 素の六箱 (bsd=false wide=false でも回る)
          - { name: ubuntu-dash,   os: ubuntu-latest,    container: '' }
          - { name: alpine-ash,    os: ubuntu-latest,    container: 'alpine:latest' }
          # wide: /bin/sh が bash の glibc、dash の Debian、musl の別の二つ、aarch64
          - { name: debian-dash,   os: ubuntu-latest,    container: 'debian:stable',              wide: true }
          - { name: fedora-bash,   os: ubuntu-latest,    container: 'fedora:latest',              wide: true }
          - { name: rocky-bash,    os: ubuntu-latest,    container: 'rockylinux/rockylinux:9',    wide: true }
          - { name: arch-bash,     os: ubuntu-latest,    container: 'archlinux:latest',           wide: true }
          - { name: leap-bash,     os: ubuntu-latest,    container: 'opensuse/leap:latest',       wide: true }
          - { name: gentoo-bash,   os: ubuntu-latest,    container: 'gentoo/stage3:latest',       wide: true }
          - { name: void-musl,     os: ubuntu-latest,    container: 'voidlinux/voidlinux-musl:latest', wide: true }
          - { name: chimera-musl,  os: ubuntu-latest,    container: 'chimeralinux/chimera:latest', wide: true }
          - { name: ubuntu-arm64,  os: ubuntu-24.04-arm, container: '',                           wide: true }
    name: linux (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        if: ${{ !matrix.wide || inputs.wide }}
      - name: distro の道具 (musl の箱は distro の JDK も)
        if: ${{ matrix.container != '' && (!matrix.wide || inputs.wide) }}
        run: sh ci/bazel-bootstrap/linux-tools.sh
      - uses: actions/setup-java@v4
        if: ${{ (!matrix.wide || inputs.wide) && !contains(matrix.name, 'musl') && matrix.container != 'alpine:latest' }}
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        if: ${{ !matrix.wide || inputs.wide }}
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: bootstrap the dist under /bin/sh (${{ matrix.name }})
        if: ${{ !matrix.wide || inputs.wide }}
        run: |
          set -x
          echo "/bin/sh -> $(readlink -f /bin/sh)  JAVA_HOME=$JAVA_HOME  JAVA_VERSION=${JAVA_VERSION:-}"
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /bin/sh
          LOG_BASH: '1'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}

  macos:
    needs: dist
    if: ${{ !inputs.jdk21 }}
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: bootstrap the dist under /bin/sh (macOS)
        run: |
          set -x
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}

  freebsd:
    needs: dist
    if: ${{ inputs.bsd && !inputs.jdk21 }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/freebsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  openbsd:
    needs: dist
    if: ${{ inputs.bsd && !inputs.jdk21 }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/openbsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  ghostbsd:
    needs: dist
    if: ${{ inputs.bsd && !inputs.jdk21 }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/ghostbsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  windows:
    needs: dist
    if: ${{ inputs.wide && !inputs.jdk21 }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: install zip and unzip
        shell: pwsh
        run: choco install zip unzip -y --no-progress
      - name: bootstrap the dist under MSYS sh (Windows)
        shell: bash
        run: |
          set -x
          export BAZEL_VC="${VCINSTALLDIR%\\}"
          export BAZEL_SH="$(cygpath -w "$(which bash)")"
          echo "sh -> $(which sh)  ($(sh -c 'echo $BASH_VERSION'))"
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /usr/bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}

  hardenedbsd:
    needs: dist
    if: ${{ inputs.wide && !inputs.jdk21 }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/hardenedbsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  # MidnightBSD は FreeBSD 派生だが uname -s が違う。bazel がどこで止まるかを
  # 見るための箱。通ることは期待していない。
  midnightbsd:
    needs: dist
    if: ${{ inputs.wide && !inputs.jdk21 }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/midnightbsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  # master は JAVA_VERSION の既定が 25 だが、Java の source が本当に 25 の言語
  # 機能を使っているかは別。JDK 21 と JAVA_VERSION=21 で建つなら、package の
  # JDK が 21 止まりの NetBSD と DragonFly でも kit 無しで建てられる。
  jdk21:
    needs: dist
    if: inputs.jdk21
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: bootstrap the dist with JDK 21
        run: |
          set -x
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}
          JAVA_VERSION: '21'

  netbsd:
    needs: dist
    if: ${{ inputs.netbsd && !inputs.jdk21 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE JDK_KIT'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
    env:
      JDK_KIT: ${{ inputs.jdk_kit && '1' || '0' }}

  dragonfly:
    needs: dist
    if: ${{ inputs.netbsd && !inputs.jdk21 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  macos-intel:
    needs: dist
    if: ${{ inputs.wide && !inputs.jdk21 }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - name: bootstrap the dist under /bin/sh (macOS Intel)
        run: |
          set -x
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}

  windows-arm64:
    needs: dist
    if: ${{ inputs.wide && !inputs.jdk21 }}
    runs-on: windows-11-arm
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: arm64 }
      - name: install zip and unzip
        shell: pwsh
        run: choco install zip unzip -y --no-progress
      - name: bootstrap the dist under MSYS sh (Windows arm64)
        shell: bash
        run: |
          set -x
          export BAZEL_VC="${VCINSTALLDIR%\\}"
          export BAZEL_SH="$(cygpath -w "$(which bash)")"
          sh ci/bazel-bootstrap/bootstrap-dist-sh.sh "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
        env:
          SH_BIN: /usr/bin/sh
          LOG_BASH: '0'
          NO_VIS: '0'
          RP_BUMP: ${{ inputs.rp_bump }}

  # aarch64 の BSD。vmactions は TCG で動かすので数時間かかる。6 時間の上限に
  # 収まらないかもしれない。どこまで行くかを見る箱。
  freebsd-arm64:
    needs: dist
    if: ${{ inputs.wide && inputs.bsd && !inputs.jdk21 }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/freebsd-vm@v1
        with:
          arch: aarch64
          release: "15.1"
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"

  openbsd-arm64:
    needs: dist
    if: ${{ inputs.wide && inputs.bsd && !inputs.jdk21 }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: master-sh-dist, path: master-sh-dist }
      - uses: vmactions/openbsd-vm@v1
        with:
          arch: aarch64
          release: "7.9"
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/bsd-master-sh.sh" "$GITHUB_WORKSPACE/master-sh-dist/bazel-distfile.zip"
