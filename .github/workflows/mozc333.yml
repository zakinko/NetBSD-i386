name: mozc333

# mozc 3.33.6089 を gyp で建てる。i386 で通るかを見るのが主目的。
#
# 3.33.6089 は gyp を積んだ最後の mozc で、次の 3.33.6133 で
# src/build_mozc.py と src/gyp/ が消える。amd64 では techne で
# mozc_server と mozc_emacs_helper と mozc_tool の三つが建つことを
# 確かめてある (doc/mozc-333.md)。
#
# i386 が本題である。bazel は singlejar の
#
#	#error This code for 64 bit Unix.
#
# で 32bit を拒むので、pkgsrc も FreeBSD ports も OpenBSD ports も i386 を
# 除外していて、いま i386 の箱に届く mozc は 2.26 止まりである。3.x を
# 載せる道は gyp しかない。
#
# 手で起動する。押すまで何もしない。qemu で NetBSD を起動して mozc を
# 二回組むので、一 job あたり数時間かかる。

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'どのイメージで回すか (all は i386 の三版を並行)'
        type: choice
        options: [all, i386-11.0, i386-10.1, i386-9.4, amd64-11.0, amd64-10.1, amd64-9.4]
        default: all
      emacs:
        description: 'どの emacs で測るか'
        type: choice
        options: [emacs30nox, emacs29nox, emacs31nox]
        default: emacs30nox

# 押し直したら前のは捨てる。VM を二つ抱えたまま二周させない。
concurrency:
  # image まで含める。含めないと一版を回した瞬間に他が打ち消される。
  group: mozc333-${{ github.ref }}-${{ inputs.image }}-${{ inputs.emacs }}
  cancel-in-progress: true

jobs:
  mozc333:
    runs-on: ubuntu-latest
    # techne (実機 3 core) で server 690 ターゲットに 40 分、elisp 379 に
    # 25 分だった。qemu の i386 では数倍を見る。
    timeout-minutes: 350
    strategy:
      # 一版で落ちても他の結果は見たい。どの版で落ちてどの版で通るかが
      # 分からないと切り分けにならない。11.0 だけで測っていたときは
      # gyp の ld = $cc が base の libstdc++ に助けられて通っていて、
      # 10.1 で建てるまで気づかなかった。
      fail-fast: false
      matrix:
        image: ${{ inputs.image == 'all' && fromJSON('["i386-11.0","i386-10.1","i386-9.4"]') || fromJSON(format('["{0}"]', inputs.image)) }}
    name: ${{ matrix.image }} ${{ inputs.emacs }}
    steps:
      - uses: actions/checkout@v4

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::KVM 無し。相当遅い"

      - name: 空きを作る
        run: |
          # mozc は distfile と work で数 GB 使う。runner の / は狭い。
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: ${{ matrix.image }} で ${{ inputs.emacs }} を測る
        run: sh ci/netbsd-mozc333.sh '${{ matrix.image }}' '${{ inputs.emacs }}'
