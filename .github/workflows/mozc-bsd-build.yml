# mozc を FreeBSD / OpenBSD / DragonFly で建てる。
#
# 上流 mozc はこの三つを知らない (src/ipc と src/base に __FreeBSD__ 等が
# 0 件)。ci/mozc-bsd/patches/ の 34 本がそれを補う。NetBSD では建って変換も
# するところまで確かめてあるが、**残りの三つでは一度も建てていない。**
#
# mozc の build は長い。いきなり通しで回すと、option の選び方や依存の解決の
# ような手前の間違いを見つけるのに何時間もかかる。段を分ける。
#
#   probe    bootstrap して show-var と depends と fetch まで。数十分
#   build    実際に建てる。数時間
#
# bazel は devel/bazel が openjdk11 を要求し、mk/java-vm.mk はそれを NetBSD の
# 四つの arch にしか許していないので、この三つでは gyp を使う。options.mk が
# OPSYS != NetBSD で gyp を返すことは NetBSD 側で測ってある。
name: mozc-bsd-build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'どの OS'
        type: choice
        options: [all, bsd, freebsd, openbsd, dragonfly, linux, macos]
        default: all
      stage:
        description: 'どこまで'
        type: choice
        options: [probe, build]
        default: probe
      pkgsrc:
        description: 'pkgsrc の配布物'
        type: choice
        options: [current, stable]
        default: current

concurrency:
  group: mozc-bsd-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    if: ${{ contains(fromJSON('["all","bsd"]'), inputs.target) || inputs.target == 'freebsd' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            uname -a; cc --version | head -2; df -h
            sh "$GITHUB_WORKSPACE/ci/mozc-bsd/run.sh" ${{ inputs.stage }} ${{ inputs.pkgsrc }}

  openbsd:
    if: ${{ contains(fromJSON('["all","bsd"]'), inputs.target) || inputs.target == 'openbsd' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            uname -a; cc --version | head -2; df -h
            sh "$GITHUB_WORKSPACE/ci/mozc-bsd/run.sh" ${{ inputs.stage }} ${{ inputs.pkgsrc }}

  dragonfly:
    if: ${{ contains(fromJSON('["all","bsd"]'), inputs.target) || inputs.target == 'dragonfly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'GITHUB_WORKSPACE'
          run: |
            set -x
            uname -a; cc --version | head -2; df -h
            sh "$GITHUB_WORKSPACE/ci/mozc-bsd/run.sh" ${{ inputs.stage }} ${{ inputs.pkgsrc }}

  # mozc が元から知っている platform。BSD へ広げた条件が、動いていた側を
  # 壊していないかを見る。VM は要らないので安い。
  linux:
    if: ${{ inputs.target == 'all' || inputs.target == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container: fedora:41
    steps:
      - name: pkgsrc の bootstrap に要るもの
        run: |
          # hostname が無いと bootstrap が「Circular dependency detected」で
          # 落ちる。本当の原因から六段離れた所に出る。
          dnf -y install -q git tar gzip bzip2 xz gcc gcc-c++ make patch \
              perl file findutils diffutils which hostname libX11-devel
      - uses: actions/checkout@v4
      - run: sh ci/mozc-bsd/run.sh ${{ inputs.stage }} ${{ inputs.pkgsrc }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

  # mozc は macOS を知っている (mach_ipc.cc)。ここも壊していないかを見る。
  macos:
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: sh ci/mozc-bsd/run.sh ${{ inputs.stage }} ${{ inputs.pkgsrc }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
