# release-9.3.0 へ出す当て物 (scripts/bootstrap の -proc:full 二箇所) が、
# Linux と macOS でも dist archive を bootstrap できることを見る。
#
# 2026-09-22: その当て物は #31195 として release-9.3.0 に入った
# (a6c5a82885)。rc2 までの dist には入っていないので、当てる道はそのまま
# 残す。9.3.0 の本番か rc3 が出たら、dist_ver をそれにして MODE=control で
# 走らせ、当てずに建つことを確かめる — そこで初めてこの workflow の役目が
# 「当て物が効くか」から「直しが降りているか」に変わる。
#
# NetBSD では ci/bazel-bsd/ で測っているが、上流の PR には Linux と macOS の
# 結果も要る。dist archive は自己完結なので、ここでは VM も pkgsrc も要らず、
# GitHub の runner の上で直に建てられる。
#
# 押したときだけ走る。bootstrap は runner で数十分かかるので push では回さない。
name: bazel-bootstrap-jvm

on:
  workflow_dispatch:
    inputs:
      dist_ver:
        description: 'bazel の dist archive の版'
        type: string
        default: '9.3.0rc2'
      sweep:
        description: 'JDK 21..25 を三通りの当て方で掃く (15 job。時間がかかる)'
        type: boolean
        default: false
      local_jdk:
        description: '二段目の javac を local の JDK にして、当て物のどちらの半分が要るかを測る (3 job)'
        type: boolean
        default: false
      alpine_only:
        description: 'posix-sh-alpine だけ走らせる (musl の直しを撃つとき)'
        type: boolean
        default: false
      alpine_musl:
        description: 'bash 入りの Alpine で musl の直しだけを当てて建てる (sh 化と切り離す)'
        type: boolean
        default: false
      master_sh:
        description: 'master の posix-sh-v2 枝そのものを dist にして /bin/sh だけで bootstrap する (Ubuntu と macOS)'
        type: boolean
        default: false

# どの組を押したかも group に入れる。ref だけだと、alpine の run が走っている
# 最中に master-sh を押した瞬間に alpine が打ち消される (実際に起きた)。
concurrency:
  group: bazel-bootstrap-jvm-${{ github.ref }}-${{ inputs.sweep }}-${{ inputs.local_jdk }}-${{ inputs.alpine_only }}-${{ inputs.alpine_musl }}-${{ inputs.master_sh }}
  cancel-in-progress: true

jobs:
  # 当てて建て、成功と version を確かめる。Linux / macOS × JDK 21 / 25。
  # JDK 21 は -proc:full が既定なので「変わらない」側の確認。
  patched:
    if: ${{ !inputs.alpine_only && !inputs.alpine_musl && !inputs.master_sh }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        jdk: ['21', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: bootstrap the patched dist
        run: |
          set -x
          sh ci/bazel-bootstrap/run-dist.sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/proc-full.patch"
        env:
          DIST_VER: ${{ inputs.dist_ver }}
          MODE: patched
          # 建った bazel で小さな workspace を建てて走らせる。bootstrap が
          # 通ったことと、出来た bazel が働くことは別の主張。
          SMOKE: '1'

  # Windows は bootstrap が一番手強い (MSVC と MSYS が要る)。Git Bash で
  # run-dist.sh を回す。bazel の cc autoconfig が windows-latest の VS2022 を
  # 見つける。出来る binary は output/bazel.exe。
  windows:
    if: ${{ !inputs.alpine_only && !inputs.alpine_musl && !inputs.master_sh }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { jdk: '21', mode: patched }
          - { jdk: '25', mode: patched }
          # 当てずに建てて、Windows でも一段目で AutoOneOf で落ちることを実測する
          # (当て物が Windows でも要ることの対照。JDK 25 のみ意味がある)。
          - { jdk: '25', mode: control }
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      # bazel は Windows で MSVC を要る。素の runner では vswhere 経由で
      # 見つからず VCVARSALL.bat not found で止まるので、VS の環境を入れて
      # BAZEL_VC を指す。
      - uses: ilammy/msvc-dev-cmd@v1
      # third_party の genrule が zip / unzip を呼ぶ (netty の native lib を絞る、
      # fastutil を ProGuard で剥いて詰め直す)。Git bash にどちらも無いので入れる。
      # 無いと Exit 127 で止まる。
      - name: install zip and unzip
        shell: pwsh
        run: choco install zip unzip -y --no-progress
      - name: bootstrap the dist (${{ matrix.mode }})
        shell: bash
        run: |
          set -x
          export BAZEL_VC="${VCINSTALLDIR%\\}"
          # genrule が bash.exe を呼ぶので (builtins_bzl.zip など)、bazel に
          # どの bash かを教える。教えないと Exit 127 で落ちる。
          export BAZEL_SH="$(cygpath -w "$(which bash)")"
          echo "BAZEL_VC=$BAZEL_VC  BAZEL_SH=$BAZEL_SH"
          sh ci/bazel-bootstrap/run-dist.sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/proc-full.patch"
        env:
          DIST_VER: ${{ inputs.dist_ver }}
          MODE: ${{ matrix.mode }}

  # bootstrap script を POSIX sh 版 (posix-sh.patch) に差し替えて、bash では
  # なく sh (Ubuntu の /bin/sh は dash) だけで通しで建てる。scripts/bootstrap の
  # bash→sh 化が実際に完走することの証明。genrule の shell も --shell_executable
  # で sh に向け、build 全体で bash を呼ばない。
  # 既定が bash でない Linux (Ubuntu/Debian の /bin/sh は dash) と、
  # 既定シェルが zsh になった macOS。どちらも /bin/sh で建てる。
  posix-sh:
    if: ${{ !inputs.alpine_only && !inputs.alpine_musl && !inputs.master_sh }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: bootstrap under /bin/sh (no bash)
        run: |
          set -x
          sh ci/bazel-bootstrap/run-posix-sh.sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/posix-sh.patch"
        env:
          DIST_VER: ${{ inputs.dist_ver }}

  # sh しかない Linux。Alpine の /bin/sh は busybox の ash で、bash は
  # 入っていない。bash が存在しない箱で建つことを示す。
  posix-sh-alpine:
    if: ${{ !inputs.alpine_musl && !inputs.master_sh }}
    runs-on: ubuntu-latest
    container: alpine:latest
    timeout-minutes: 90
    steps:
      - name: install the tools Alpine does not ship
        run: |
          set -x
          apk add --no-cache openjdk21 build-base linux-headers zip unzip curl \
            python3 patch findutils coreutils grep sed which git
          # bash は入れない。入っていないことを確かめる。
          if command -v bash >/dev/null 2>&1; then
            echo "bash が入っている。この job の前提が崩れる"; exit 1
          fi
          echo "bash は無い。/bin/sh は $(readlink -f /bin/sh)"
      - uses: actions/checkout@v4
      - name: bootstrap under busybox ash (bash が無い箱)
        run: |
          set -x
          sh ci/bazel-bootstrap/run-posix-sh.sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/posix-sh.patch"
        env:
          DIST_VER: ${{ inputs.dist_ver }}
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk
          # Alpine は musl で、unix_jni.h が glibc の stat64 を決め打ちして
          # いるため 738/5,619 action 目で落ちる。その直しを一枚当てて、
          # sh 化の先へ進むか (そして次に何で止まるか) を見る。
          EXTRA_PATCH: ${{ github.workspace }}/ci/bazel-bootstrap/musl-stat.patch

  # 当てずに建て、既知の場所で落ちることを確かめる (JDK 25、Linux のみ)。
  # 当て物が実際に何かを直していることの対照。落ちるのが成功なので緑になる。
  control:
    if: ${{ !inputs.alpine_only && !inputs.alpine_musl && !inputs.master_sh }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: bootstrap the unpatched dist (expected to fail on the processors)
        run: |
          set -x
          sh ci/bazel-bootstrap/run-dist.sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/proc-full.patch"
        env:
          DIST_VER: ${{ inputs.dist_ver }}
          MODE: control

  # どの JDK から落ちるのか、そして当て物のどちらの半分が効いているのかを
  # 分けて測る。9.3.0 の bootstrap.sh は --java_runtime_version=${JAVA_VERSION}
  # (= 遠隔 JDK 21) を指すので、二段目の genrule の javac は JAVA_HOME の
  # JDK ではなく遠隔 21 になる箱がある。つまり compile.sh の半分と
  # bootstrap.sh の半分は、効く箱が違う可能性がある。読んで決めずに撃つ。
  #
  #   control        当てない
  #   compile-only   compile.sh だけ (一段目の javac)
  #   both           両方 (出そうとしている当て物そのもの)
  jdk-sweep:
    if: ${{ inputs.sweep && !inputs.alpine_only && !inputs.alpine_musl && !inputs.master_sh }}
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21', '22', '23', '24', '25']
        variant: [control, compile-only, both]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: JDK ${{ matrix.jdk }} / ${{ matrix.variant }}
        run: |
          set -x
          case "${{ matrix.variant }}" in
          control)      P=proc-full.patch ;;
          compile-only) P=proc-full-compile-only.patch ;;
          both)         P=proc-full.patch ;;
          esac
          sh ci/bazel-bootstrap/run-dist.sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/$P"
        env:
          DIST_VER: ${{ inputs.dist_ver }}
          MODE: ${{ matrix.variant == 'control' && 'control' || 'patched' }}
          # 21 と 22 では素のままでも建つのが正しいので、建ったことを失敗に
          # しない。どちらだったかだけ報告させる。
          CONTROL_EXPECT: either
          SMOKE: '1'

  # 当て物の bootstrap.sh 側の半分が、どこで効くのかを出す。
  #
  # 9.3.0 の bootstrap.sh は --java_runtime_version=${JAVA_VERSION} (= 遠隔
  # JDK 21) を指す。二段目の JavacBootstrap genrule は toolchain の
  # java_runtime の javac を呼ぶので、遠隔 21 が在る箱では二段目は 21 で走り、
  # bootstrap.sh 側の -proc:full は何も変えない。JDK 掃き (run 35305507603) で
  # 実際にそうなった。compile.sh だけで 23/24/25 とも建つ。
  #
  # 遠隔 JDK が配られていない箱 (BSD) では local の JDK が二段目に来る。
  # その条件を Linux で作って、bootstrap.sh 側の半分が要るのかを測る。
  # 要らないなら当て物から落とす。踏んでいない行は送らない。
  local-jdk:
    if: ${{ inputs.local_jdk && !inputs.alpine_only && !inputs.alpine_musl && !inputs.master_sh }}
    strategy:
      fail-fast: false
      matrix:
        variant: [control, compile-only, both]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: local_jdk / ${{ matrix.variant }}
        run: |
          set -x
          case "${{ matrix.variant }}" in
          control)      P=proc-full.patch ;;
          compile-only) P=proc-full-compile-only.patch ;;
          both)         P=proc-full.patch ;;
          esac
          sh ci/bazel-bootstrap/run-dist.sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/$P"
        env:
          DIST_VER: ${{ inputs.dist_ver }}
          MODE: ${{ matrix.variant == 'control' && 'control' || 'patched' }}
          CONTROL_EXPECT: either
          SMOKE: '1'
          # 二段目の javac を JAVA_HOME の JDK 25 にする。BSD で起きている
          # ことを Linux で作る。
          EXTRA_BAZEL_ARGS: '--java_runtime_version=local_jdk --tool_java_runtime_version=local_jdk'

  # musl の直し (unix_jni.h の stat64) を、bash の有無と切り離して測る。
  # bash を入れた Alpine で、9.3.0rc2 に musl-stat.patch だけを当てて建てる。
  # bash が無い箱では rules_jvm_external の StampJarManifest (env bash) で
  # 止まるので、そちらは別の話として分ける。建ったら煙試験まで。
  alpine-musl:
    if: inputs.alpine_musl
    runs-on: ubuntu-latest
    container: alpine:latest
    timeout-minutes: 120
    steps:
      - name: install the tools Alpine does not ship (bash を含む)
        run: |
          set -x
          apk add --no-cache openjdk21 build-base linux-headers zip unzip curl \
            python3 patch findutils coreutils grep sed which git bash
          echo "bash: $(command -v bash)  musl: $(ls /lib/ld-musl-* 2>/dev/null)"
      - uses: actions/checkout@v4
      # 当て物は二枚重ね: musl-stat.patch (master 宛の直しそのもの) と
      # singlejar-off64-9.3.0.patch (9.3.0 だけに要る port.h の腕。master は
      # #30317 で off64_t を使わなくなっているので不要)。
      - name: bootstrap 9.3.0rc2 with the musl fixes
        run: |
          set -x
          sh ci/bazel-bootstrap/run-dist.sh "$GITHUB_WORKSPACE/ci/bazel-bootstrap/alpine-9.3.0.patch"
        env:
          DIST_VER: ${{ inputs.dist_ver }}
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk
          MODE: patched
          SMOKE: '1'
          # rules_java の遠隔 JDK は glibc 向けの binary で、musl では
          # ld-linux が無く execvp が ENOENT になる。Alpine の利用者は箱の
          # openjdk を使うので、それに合わせる。bootstrap と煙試験の両方に効く。
          EXTRA_BAZEL_ARGS: '--java_runtime_version=local_jdk --tool_java_runtime_version=local_jdk'
          # ijar / singlejar / turbine の prebuilt も glibc 向け。source から建てる
          # toolchain を煙試験の workspace で定義して使う。
          SMOKE_NONPREBUILT: '1'

  # master の bash→sh の枝を、枝そのもので踏む。配布済み bazel で枝から dist を
  # 作り、その dist を /bin/sh だけで bootstrap し、出来た bazel で煙試験。
  # Ubuntu では /bin/bash を記録 wrapper に差し替え、bootstrap の間に誰が bash を
  # 呼んだかを全部数える (--shell_executable では shebang や env bash は
  # 消えないので、数えるまで「bash を呼ばない」とは言えない)。
  # macOS は /bin/bash が SIP で触れないので記録は無し。
  master-sh:
    if: inputs.master_sh
    strategy:
      fail-fast: false
      matrix:
        include:
          # 対照: 同じ dist を bash で bootstrap する。ここで落ちる物は sh 化の
          # せいではない
          - { os: ubuntu-latest, sh: /bin/bash, log_bash: '0', no_vis: '0', name: control-bash }
          # 本番: sh で bootstrap し、bash を誰が呼んだかを数える
          - { os: ubuntu-latest, sh: /bin/sh,   log_bash: '1', no_vis: '0', name: sh }
          # master の rules_python の visibility の壁を切って、sh 化の script を
          # analysis の先まで踏ませる
          - { os: ubuntu-latest, sh: /bin/sh,   log_bash: '1', no_vis: '1', name: sh-novis }
          - { os: macos-latest,  sh: /bin/sh,   log_bash: '0', no_vis: '1', name: sh-novis }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: master posix-sh-v2 (${{ matrix.name }})
        run: |
          set -x
          echo "/bin/sh -> $(readlink -f /bin/sh 2>/dev/null || readlink /bin/sh || echo '(macOS: bash in posix mode)')"
          sh ci/bazel-bootstrap/run-master-sh.sh
        env:
          BRANCH: posix-sh-v2
          SH_BIN: ${{ matrix.sh }}
          LOG_BASH: ${{ matrix.log_bash }}
          NO_VIS: ${{ matrix.no_vis }}
